<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Smart Survey Platform demo: AI-assisted survey research from client brief to cited report. Demo data only.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%2302234a%22%2F%3E%3Cpath%20d%3D%22M12%2010h12M12%2016h12M12%2022h9%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%227.5%22%20cy%3D%2222%22%20r%3D%221.8%22%20fill%3D%22%2330b4b4%22%2F%3E%3Cpath%20d%3D%22m5.5%2010%201.5%201.5%203-3M5.5%2016l1.5%201.5%203-3%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Smart Survey Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Light theme only. Layout: admin shell. 56px header, 240px sidebar with workflow nav, cards on a soft grey canvas. Navy brand, purple for interaction. */
:root {
  --bg: #f4f5f8;
  --panel: #ffffff;
  --side: #f7f8fa;
  --panel-2: #f8f9fb;
  --navy: #02234a;
  --ink: #02234a;
  --text: #1d2639;
  --muted: #6b7385;
  --line: #e5e8ee;
  --line-2: #eef0f4;
  --accent: #603cfc;
  --accent-ink: #ffffff;
  --accent-soft: #f0ecff;
  --teal: #30b4b4;
  --teal-soft: #e6f6f6;
  --teal-ink: #137171;
  --orange: #f99000;
  --orange-soft: #fff3e0;
  --orange-ink: #8f5300;
  --magenta: #f00054;
  --magenta-soft: #ffe8ef;
  --crit: #d03b3b;
  --serious: #ec835a;
  --warn: #fab219;
  --good: #0ca30c;
  --crit-soft: #fdecec;
  --warn-soft: #fff7e5;
  --good-soft: #e7f6e7;
  --good-ink: #006300;
  --s1: #603cfc;
  --o1: #a08bfd;
  --o2: #603cfc;
  --o3: #2e1a99;
  --grid: #e6e8ee;
  --hero-a: #02234a;
  --hero-b: #2a1e8f;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
  --f-sans: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 12px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--f-sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; color: var(--ink); text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.ico { width: 18px; height: 18px; flex: none; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 56px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 34px; height: 34px; border-radius: 10px; background: var(--navy); display: grid; place-items: center; flex: none; }
.mark svg { width: 20px; height: 20px; }
.brand-name { font-weight: 800; color: var(--ink); font-size: 15px; line-height: 1.15; white-space: nowrap; }
.brand-ver { font-size: 11px; color: var(--accent); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.top-spacer { flex: 1; }
.mode { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--panel-2); }
.mode button { white-space: nowrap; border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.mode button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.mode button:disabled { opacity: 0.45; cursor: not-allowed; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.user { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--accent-soft); color: var(--accent); flex: none; }

/* Shell */
.shell { display: flex; align-items: flex-start; min-height: calc(100vh - 56px); }
.side { width: 240px; flex: none; position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); height: calc(100vh - 56px - env(safe-area-inset-top, 0px)); overflow-y: auto;
  background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; padding-left: max(12px, env(safe-area-inset-left, 0px)); }
.nav-group { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 14px 12px 6px; }
.nav { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text); font-size: 14px; font-weight: 500; }
.nav:hover { background: var(--line-2); }
.nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.nav .badge { margin-left: auto; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 0 7px; min-width: 20px; text-align: center; background: var(--line); color: var(--text); }
.nav .badge.crit { background: var(--crit); color: #fff; }
.nav .badge.warn { background: var(--orange); color: #fff; }
.nav .badge.ok { background: var(--good-soft); color: var(--good-ink); }
.side-foot { margin-top: auto; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
.side-foot b { color: var(--ink); font-size: 13px; }
main { flex: 1; min-width: 0; padding: 24px 32px 48px; padding-right: max(32px, env(safe-area-inset-right, 0px)); }
.view[hidden] { display: none; }
.view { max-width: 1240px; margin: 0 auto; display: grid; gap: 20px; }
@media (max-width: 900px) {
  .shell { display: block; }
  .side { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 15; width: auto; height: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; gap: 4px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .nav-group, .side-foot { display: none; }
  .nav { width: auto; white-space: nowrap; padding: 8px 12px; }
  main { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
  .user span { display: none; }
}
@media (max-width: 560px) { .brand-ver, .brand-name, .user { display: none; } .top { gap: 10px; } }

/* Page header */
.page-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.ph-title { display: flex; align-items: center; gap: 8px; }
.ph-title h1 { font-size: 22px; font-weight: 800; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Info tooltip trigger */
.info { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--muted); color: var(--muted); background: transparent; font: 700 11px/1 var(--f-sans); display: inline-grid; place-items: center; cursor: help; padding: 0; flex: none; vertical-align: middle; }
.info:hover, .info:focus-visible { border-color: var(--accent); color: var(--accent); }
#tip { position: fixed; pointer-events: none; z-index: 60; background: var(--navy); color: #fff; font-size: 12.5px; line-height: 1.45; padding: 8px 10px; border-radius: 8px; max-width: 320px; white-space: pre-line; box-shadow: 0 8px 24px rgba(2, 35, 74, 0.25); }

/* Buttons */
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 0 14px; height: 36px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12px; }
.btn .ico { width: 16px; height: 16px; }

/* Status line for AI actions */
.status { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status:empty { display: none; }
.status .spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .status .spin { animation: none; } }
.src { font-size: 11px; border-radius: 6px; padding: 1px 7px; font-weight: 700; }
.src.live { background: var(--accent-soft); color: var(--accent); }
.src.replay { background: var(--line-2); color: var(--muted); }

/* Cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card-head h2 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card-head .sub { color: var(--muted); font-size: 12px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
.grid-2r { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 20px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: stretch; }
.stack { display: grid; gap: 20px; min-width: 0; align-content: start; }
@media (max-width: 1100px) { .grid-2, .grid-2r, .grid-3 { grid-template-columns: minmax(0, 1fr); } }

/* Hero */
.hero { position: relative; overflow: hidden; border-radius: 16px; padding: 28px 32px; color: #fff; background: linear-gradient(115deg, var(--hero-a) 0%, var(--hero-b) 70%, #603cfc 100%); display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.55; pointer-events: none; }
.hero::before { width: 260px; height: 260px; right: 8%; top: -120px; background: #30b4b4; }
.hero::after { width: 220px; height: 220px; right: -60px; bottom: -120px; background: #f00054; opacity: 0.35; }
.hero > * { position: relative; }
.hero .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.9; }
.hero h1 { color: #fff; font-size: 28px; font-weight: 800; margin: 6px 0 6px; }
.hero p { opacity: 0.85; font-size: 14px; }
.hero .btn { background: #fff; color: var(--navy); border-color: #fff; }

/* Module cards */
.modules { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.module { text-align: left; cursor: pointer; display: grid; gap: 10px; align-content: start; transition: border-color 0.15s, transform 0.15s; }
.module:hover { border-color: var(--accent); }
.mod-ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
.mod-ico .ico { width: 20px; height: 20px; }
.tint-purple { background: var(--accent-soft); color: var(--accent); }
.tint-teal { background: var(--teal-soft); color: var(--teal-ink); }
.tint-orange { background: var(--orange-soft); color: var(--orange-ink); }
.tint-magenta { background: var(--magenta-soft); color: var(--magenta); }
.tint-navy { background: var(--line-2); color: var(--ink); }
.module .step { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.module h3 { font-size: 15px; font-weight: 700; }
.module p { color: var(--muted); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; background: var(--line-2); color: var(--text); width: fit-content; }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.ok { background: var(--good-soft); color: var(--good-ink); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.steps-list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.steps-list li { display: flex; gap: 12px; align-items: flex-start; font-size: 13px; }
.steps-list .n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12px; display: grid; place-items: center; flex: none; }
.checks { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; font-size: 13px; }
.checks li { display: flex; gap: 10px; align-items: flex-start; }
.checks .ico { width: 18px; height: 18px; color: var(--teal); }

/* Stat tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; box-shadow: var(--shadow); }
.tile .t-label { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tile .t-value { font-size: 24px; font-weight: 800; color: var(--ink); line-height: 1.2; }
.tile .t-note { font-size: 12px; color: var(--muted); }
.tile.alert { border-color: var(--crit); }
.tile.alert .t-value { color: var(--crit); }

/* Key-value */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; border-radius: 6px; padding: 1px 7px; font-weight: 600; white-space: nowrap; }
.chip.reuse { background: var(--teal-soft); color: var(--teal-ink); }
.chip.new { background: var(--orange-soft); color: var(--orange-ink); }
.chip.fixed { background: var(--good-soft); color: var(--good-ink); }
.chip.type { background: var(--line-2); color: var(--muted); font-family: var(--f-mono); font-weight: 500; }
.chip.scope { background: var(--accent-soft); color: var(--accent); }
.chip.route { background: transparent; border: 1px solid var(--line); color: var(--accent); font-family: var(--f-mono); font-weight: 500; white-space: normal; }
.chip.route.term { color: var(--crit); }
.sev { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 8px; }
.sev.critical { background: var(--crit-soft); color: var(--crit); }
.sev.high, .sev.serious { background: var(--orange-soft); color: var(--orange-ink); }
.sev.medium { background: var(--warn-soft); color: var(--orange-ink); }
.sev.low { background: var(--line-2); color: var(--muted); }
.sev.ok { background: var(--good-soft); color: var(--good-ink); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filter { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text); }
.filter[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* Brief + composition */
textarea.brief { width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--panel-2); resize: vertical; font-size: 13px; line-height: 1.55; color: var(--text); }
.bignums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.bignums div { display: grid; }
.bignums b { font-size: 22px; font-weight: 800; color: var(--ink); line-height: 1.2; }
.bignums span { font-size: 12px; color: var(--muted); }
.compo { display: flex; height: 8px; border-radius: 999px; overflow: hidden; gap: 2px; margin: 14px 0 8px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
.list { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.list-row > * { flex-shrink: 0; }
.list-row > .grow { flex-shrink: 1; }
.list-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.list-row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Questionnaire */
.qblock + .qblock { margin-top: 18px; }
.qblock-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.qblock-head .letter { font-family: var(--f-mono); font-weight: 700; font-size: 11px; background: var(--navy); color: #fff; border-radius: 6px; padding: 1px 7px; }
.qblock-head h3 { font-size: 14px; font-weight: 700; }
.qblock-head .count { color: var(--muted); font-size: 12px; }
.q { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 8px; border-radius: 8px; align-items: start; }
.q + .q { border-top: 1px solid var(--line-2); }
.q.flagged { background: var(--warn-soft); }
.q.flagged.crit { background: var(--crit-soft); }
.q .qid { font-family: var(--f-mono); font-weight: 600; font-size: 12px; padding-top: 2px; color: var(--ink); }
.q .qtext { font-size: 14px; color: var(--text); }
.q .qmeta { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.q .info { grid-column: 3; grid-row: 1; margin-top: 2px; }

/* Issues */
.issues { display: grid; gap: 10px; }
.issue { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; background: var(--panel); }
.issue-main { display: grid; gap: 6px; min-width: 0; }
.issue-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.issue-top .kind { font-size: 12px; color: var(--muted); }
.issue h3 { font-size: 14px; font-weight: 650; color: var(--text); }
.issue-side { display: flex; gap: 8px; align-items: center; flex: none; }
.faces { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.faces .stack-av { display: flex; }
.faces .av { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--panel); margin-left: -6px; display: grid; place-items: center; font-size: 10px; font-weight: 700; cursor: help; }
.faces .av:first-child { margin-left: 0; }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty b { color: var(--ink); }

/* Personas */
.personas { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.persona { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; background: var(--panel); align-content: start; }
.persona-top { display: flex; gap: 10px; align-items: center; }
.persona .who { font-weight: 700; color: var(--ink); font-size: 14px; }
.persona .meta { font-size: 12px; color: var(--muted); }
.persona-top .info { margin-left: auto; }
.path { display: flex; gap: 3px; flex-wrap: wrap; }
.path span { font-family: var(--f-mono); font-size: 10.5px; padding: 0 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.path span.off { background: var(--line-2); color: var(--muted); text-decoration: line-through; }
.persona-foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.notes-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; cursor: help; border: 0; }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
th { font-weight: 600; color: var(--muted); font-size: 12px; white-space: nowrap; background: var(--panel-2); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover td { background: var(--panel-2); }
tr.sel td { background: var(--accent-soft) !important; }
tr.flag-row td:first-child { box-shadow: inset 3px 0 0 var(--crit); }
.sig { font-size: 10px; font-weight: 700; color: var(--accent); vertical-align: super; margin-left: 1px; }
.base td { color: var(--muted); font-size: 12px; }
.cov th { text-align: center; font-size: 11px; padding: 6px 4px; }
.cov td.cell { text-align: center; font-variant-numeric: tabular-nums; font-size: 12px; min-width: 40px; padding: 6px 4px; }
.cov td.dead { box-shadow: inset 0 0 0 2px var(--crit); }
.tbl-hl { outline: 2px solid var(--accent); outline-offset: 2px; }
table.tight td, table.tight th { padding: 8px 8px; white-space: nowrap; }
select.act { border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: var(--panel); font-size: 12px; }
.check-row { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 12px; }

/* Report */
.summary .headline { font-size: 20px; font-weight: 800; line-height: 1.3; margin: 4px 0 6px; }
.finding { display: grid; gap: 3px; padding: 12px 0; border-top: 1px solid var(--line-2); font-size: 13.5px; }
.finding b { font-weight: 700; color: var(--ink); }
.cite { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 5px; padding: 0 5px; cursor: pointer; margin-left: 6px; vertical-align: 1px; }
.cite:hover { background: var(--accent-soft); }
.summary ul { margin: 6px 0 0; padding-left: 18px; }
.summary li { margin: 3px 0; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.conf { font-variant-numeric: tabular-nums; font-size: 12px; }
.conf.low { color: var(--crit); font-weight: 700; }

/* KB */
.search { border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; height: 34px; background: var(--panel); width: min(100%, 280px); }
.insights { display: grid; gap: 10px; }
.insight { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; background: var(--panel); font-size: 13px; }
.insight .meta { font-size: 11px; color: var(--muted); font-weight: 600; }
.insight.added { border-color: var(--orange); }
tr.new-row td { background: var(--orange-soft); }

/* Charts */
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--muted); font-family: var(--f-sans); font-size: 11px; }
svg.chart text.val { fill: var(--ink); font-weight: 700; }
svg.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart-cap { font-size: 12px; color: var(--muted); margin-top: 8px; display: flex; gap: 6px; align-items: center; }
.ai-note { font-size: 13px; white-space: pre-wrap; color: var(--text); background: var(--panel-2); border-radius: 10px; padding: 12px 14px; border: 1px solid var(--line-2); }

/* Toast */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; max-width: min(92vw, 520px); box-shadow: 0 8px 24px rgba(2, 35, 74, 0.25); }

/* Campaign context: header switcher, popover, context bar, stage stepper */
.dotc { width: 22px; height: 22px; border-radius: 50%; background: var(--teal-soft); color: var(--teal-ink); display: inline-grid; place-items: center; font-size: 10px; font-weight: 800; flex: none; }
.pop { position: fixed; z-index: 45; width: min(400px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(2, 35, 74, 0.18); padding: 10px; display: grid; gap: 4px; max-height: min(72vh, 540px); overflow: auto; }
.pop .search { width: 100%; }
.pop-group { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 8px 2px; display: flex; align-items: center; gap: 6px; }
.pop-item { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; text-align: left; padding: 8px; border-radius: 8px; cursor: pointer; color: var(--text); }
.pop-item:hover, .pop-item:focus-visible, .pop-item[aria-current="true"] { background: var(--accent-soft); }
.pop-item .grow { flex: 1; min-width: 0; display: grid; }
.pop-item .grow span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pop-item .mono { font-size: 11px; color: var(--muted); }
.pop-foot { display: flex; gap: 8px; border-top: 1px solid var(--line-2); padding-top: 10px; margin-top: 6px; flex-wrap: wrap; }
.ctxbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; box-shadow: var(--shadow); }
.crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; flex-wrap: wrap; }
.crumb b { color: var(--ink); }
.crumb .sep { color: var(--muted); }
.crumb .mono { font-size: 12px; color: var(--muted); }
.stepper { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
.stepper li { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--line-2); color: var(--muted); white-space: nowrap; }
.stepper li.done { background: var(--good-soft); color: var(--good-ink); }
.stepper li.cur { background: var(--accent); color: var(--accent-ink); }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; font-size: inherit; }
.stp { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 9px; white-space: nowrap; display: inline-block; }
.stp.s-Draft { background: var(--line-2); color: var(--muted); }
.stp.s-Building { background: var(--accent-soft); color: var(--accent); }
.stp.s-Pretest { background: var(--teal-soft); color: var(--teal-ink); }
.stp.s-Infield { background: var(--orange-soft); color: var(--orange-ink); }
.stp.s-Analysis { background: var(--magenta-soft); color: var(--magenta); }
.stp.s-Reported, .stp.s-Active { background: var(--good-soft); color: var(--good-ink); }
.stp.s-Prospect { background: var(--orange-soft); color: var(--orange-ink); }
.stp.s-Archived { background: var(--line-2); color: var(--muted); }

/* Forms */
.form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 16px; }
.form-grid .span2 { grid-column: span 2; }
.form-grid .full { grid-column: 1 / -1; }
.fld { display: grid; gap: 5px; font-size: 12px; font-weight: 600; color: var(--text); align-content: start; }
.fld input, .fld select, .fld textarea { font: 400 13px/1.4 var(--f-sans); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel-2); color: var(--text); width: 100%; min-width: 0; }
.fld textarea { min-height: 170px; resize: vertical; line-height: 1.55; }
.fld .hint { font-weight: 400; color: var(--muted); }
.fld.err input, .fld.err select, .fld.err textarea, .fld.err .cities { border-color: var(--crit); }
.fld .msg { color: var(--crit); font-weight: 500; }
.cities { display: flex; gap: 6px; flex-wrap: wrap; border: 1px solid transparent; border-radius: 8px; }
.cities label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-weight: 500; cursor: pointer; background: var(--panel); }
.cities input { width: auto; margin: 0; }
.form-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-2); }
.form-foot .muted { font-size: 12px; }
@media (max-width: 900px) { .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .form-grid { grid-template-columns: minmax(0, 1fr); } .form-grid .span2 { grid-column: auto; } }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar select { border: 1px solid var(--line); border-radius: 8px; height: 34px; padding: 0 10px; background: var(--panel); font-size: 13px; }

/* View toggle and timeline */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.gantt-wrap { overflow-x: auto; }
.gantt-wrap svg.chart { max-width: none; }
.empty .ico { width: 28px; height: 28px; color: var(--muted); }
tr.cur-row td { background: var(--accent-soft); }

/* Workflow campaign picker: scopes the three workflow steps in the sidebar */
.nav-group .info { width: 15px; height: 15px; font-size: 9px; margin-left: 6px; vertical-align: -2px; }
.wf { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 6px; display: grid; gap: 2px; }
.wf-pick { display: flex; align-items: center; gap: 8px; width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 7px 8px; background: var(--panel-2); cursor: pointer; text-align: left; color: var(--text); margin-bottom: 4px; min-width: 0; }
.wf-pick:hover, .wf-pick[aria-expanded="true"] { border-color: var(--accent); }
.wf-pick > .ico { width: 14px; height: 14px; color: var(--muted); margin-left: auto; }
.wf-txt { display: grid; min-width: 0; flex: 1; }
.wf-id { display: flex; align-items: center; gap: 6px; }
.wf-id b { font-family: var(--f-mono); font-size: 12px; color: var(--ink); }
.wf-id .stp { font-size: 10px; padding: 1px 7px; }
.wf-name { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf .nav { padding: 8px 10px; }

/* Report pages */
.picker { border: 1px solid var(--line); border-radius: 8px; height: 34px; padding: 0 10px; background: var(--panel); max-width: min(100%, 340px); }
.grid-2e { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
@media (max-width: 1100px) { .grid-2e { grid-template-columns: minmax(0, 1fr); } }
.live-chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 11px; font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; }
button.live-chip { cursor: pointer; border-color: var(--accent); color: var(--accent); }
.live-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 color-mix(in oklab, var(--good) 60%, transparent); animation: pulse 1.8s infinite; }
.live-chip.idle i { background: var(--muted); animation: none; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .live-chip i { animation: none; } }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .filters { flex: 1; min-width: 0; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.qgrid.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); }
.qcard { border: 1px solid var(--line-2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; min-width: 0; scroll-margin-top: 90px; }
.qcard.tbl-hl, .card.tbl-hl { outline: 2px solid var(--accent); outline-offset: 2px; }
.qc-head { display: flex; gap: 8px; align-items: baseline; }
.qc-head .qid { font-size: 11px; font-weight: 700; color: var(--accent); flex: none; }
.qc-text { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.35; }
.qc-meta { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); }
.qc-big { display: flex; align-items: baseline; gap: 8px; }
.qc-big b { font-size: 24px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.qc-big span { font-size: 12px; color: var(--muted); }
.hbars { display: grid; gap: 5px; }
.hb { display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; }
.hb-l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.hb-t { height: 10px; background: var(--line-2); border-radius: 4px; overflow: hidden; }
.hb-t i { display: block; height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; }
.hb-v { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); min-width: 34px; text-align: right; }
.verbatims { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 12.5px; color: var(--text); }
.verbatims li { background: var(--panel-2); border-radius: 8px; padding: 6px 10px; }
table.xt { font-size: 12px; }
table.xt td, table.xt th { padding: 6px 8px; white-space: nowrap; }
table.xt td:first-child { white-space: normal; min-width: 110px; }
.stack-bar { display: flex; height: 14px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--panel); }
.stack-bar i { display: block; height: 100%; }
.prof { display: grid; gap: 6px; margin-top: 14px; }
.prof-rows { display: grid; gap: 10px; }
.prof-row { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
table.track td, table.track th { white-space: nowrap; }
.delta { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.delta.sig { color: var(--ink); font-weight: 800; }
.note-bar { background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 10px 14px; font-size: 13px; }

/* Executive summary */
.exec-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 20px; align-items: start; }
@media (max-width: 1100px) { .exec-grid { grid-template-columns: minmax(0, 1fr); } }
.doc { padding: 28px 32px; display: grid; gap: 10px; }
@media (max-width: 600px) { .doc { padding: 20px 18px; } }
.doc-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.doc-title { font-size: 26px; font-weight: 800; }
.doc-sub { color: var(--muted); font-size: 12.5px; }
.doc-headline { font-size: 19px; font-weight: 800; line-height: 1.35; background: var(--accent-soft); border-radius: 10px; padding: 14px 16px; margin: 6px 0; }
.doc-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.doc-kpis div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 1px; }
.doc-kpis b { font-size: 22px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.doc-kpis span { font-size: 12px; color: var(--text); }
.doc-kpis small { font-size: 11px; color: var(--muted); }
.doc h3 { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-top: 12px; }
.doc ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; }
.doc-findings { margin: 0; padding-left: 20px; display: grid; gap: 12px; }
.doc-findings li::marker { color: var(--accent); font-weight: 800; }
.doc-findings b { color: var(--ink); font-size: 14px; }
.doc-findings p { margin: 3px 0 0; font-size: 13.5px; }
.doc-fig { margin: 8px 0 0; border: 1px solid var(--line-2); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.doc-fig figcaption { font-size: 12px; font-weight: 700; color: var(--ink); }
.doc-foot { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; font-size: 11.5px; color: var(--muted); }
.chat { display: grid; gap: 10px; position: sticky; top: 76px; }
.chat-log { display: grid; gap: 8px; max-height: 360px; overflow-y: auto; align-content: start; padding-right: 2px; }
.msg { font-size: 13px; line-height: 1.45; padding: 8px 11px; border-radius: 12px; max-width: 92%; white-space: pre-line; }
.msg.ai { background: var(--panel-2); border: 1px solid var(--line-2); justify-self: start; }
.msg.me { background: var(--accent); color: var(--accent-ink); justify-self: end; }
.msg.typing { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.msg .spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
.chat-sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.chat-form { display: flex; gap: 8px; align-items: flex-end; }
.chat-form textarea { flex: 1; min-width: 0; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel); min-height: 40px; font-size: 13px; }
.chat-form .btn { height: 40px; }
.versions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line-2); padding-top: 10px; }
.vchip { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 1px 8px; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--muted); font-family: var(--f-mono); }
.vchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
@media (max-width: 900px) {
  .wf { display: flex; align-items: center; gap: 2px; padding: 3px; flex: none; border-radius: 10px; }
  .wf-pick { width: auto; margin: 0; padding: 5px 8px; flex: none; }
  .wf-pick .wf-name, .wf-pick .wf-id .stp { display: none; }
  .wf .nav { padding: 6px 10px; }
  .chat { position: static; }
}

/* Survey Builder editing */
.btn.danger { border-color: var(--crit); color: var(--crit); }
.link .ico { width: 13px; height: 13px; vertical-align: -2px; margin-right: 2px; }
.qblock-head .link { margin-left: auto; }
.q { grid-template-columns: 40px minmax(0, 1fr) auto; }
.q .qact { grid-column: 3; grid-row: 2; display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; }
.q:hover .qact, .q:focus-within .qact, .q .qact:has(.danger) { opacity: 1; }
@media (hover: none) { .q .qact { opacity: 1; } }
.ib { border: 1px solid transparent; background: transparent; border-radius: 6px; height: 26px; min-width: 26px; padding: 0 4px; display: inline-grid; place-items: center; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 700; }
.ib:hover { border-color: var(--line); color: var(--ink); background: var(--panel); }
.ib .ico { width: 14px; height: 14px; }
.ib.danger { color: #fff; background: var(--crit); border-color: var(--crit); padding: 0 8px; }
.qedit { border: 1.5px solid var(--accent); border-radius: 10px; padding: 14px; margin: 8px 0; background: var(--panel); display: grid; gap: 12px; scroll-margin-top: 90px; }
.qedit-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.qedit-head b { color: var(--ink); }
.qe-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.qe-grid .full { grid-column: 1 / -1; }
.qedit textarea { width: 100%; }
.qedit .form-foot { margin: 0; padding: 0; border: 0; }
.checks-row { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 13px; }
.checks-row label { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--panel); cursor: pointer; }
.fld .checks-row input { width: auto; min-width: 0; margin: 0; padding: 0; }
.qedit .fld textarea { min-height: 0; }
.picker-card .toolbar .search { flex: 1; min-width: 160px; }
.bp-list { display: grid; max-height: 320px; overflow-y: auto; }
.bp-row { display: flex; gap: 10px; align-items: center; padding: 8px 4px; border-top: 1px solid var(--line-2); font-size: 13px; }
.bp-row .grow { flex: 1; min-width: 0; }

/* Knowledge base */
table.bank td { vertical-align: top; }
.qmeta-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.chip:not([class*=" "]) { background: var(--line-2); color: var(--muted); }
.used { display: flex; flex-wrap: wrap; gap: 4px; }
.used .chip.route { cursor: pointer; }
.docs { display: grid; gap: 8px; }
.doc-row { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; scroll-margin-top: 90px; }
.doc-row.open { border-color: var(--accent); }
.doc-main { display: flex; gap: 12px; align-items: center; width: 100%; border: 0; background: transparent; padding: 10px 12px; cursor: pointer; text-align: left; color: var(--text); }
.doc-main:hover { background: var(--panel-2); }
.doc-main .grow { flex: 1; min-width: 0; display: grid; }
.doc-main .grow b { color: var(--ink); font-size: 13.5px; }
.dkind { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent); }
.dkind.k-PDF { background: var(--magenta-soft); color: var(--magenta); }
.dkind.k-Sheet { background: var(--good-soft); color: var(--good-ink); }

<script>
// Smart Survey Platform engine: questionnaire model, routing, pretest simulation, field data,
// quality control and tabulation. Pure functions, no DOM, so it runs in Node too.

if (typeof module !== "undefined" && typeof KB === "undefined") {
  Object.assign(globalThis, require("./data.js"));
}

// ---------- Utilities ----------

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pickWeighted(rng, weights) {
  const total = weights.reduce((a, b) => a + b, 0);
  let r = rng() * total;
  for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r <= 0) return i; }
  return weights.length - 1;
}
function normal(rng, mean, sd) {
  const u = 1 - rng(), v = rng();
  return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const median = arr => { if (!arr.length) return 0; const s = [...arr].sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const clone = o => JSON.parse(JSON.stringify(o));
const kbById = id => KB.find(x => x.id === id);

// ---------- Questionnaire model ----------

// Fill reused questions from the bank and normalise every question.
function hydrate(qn) {
  const out = clone(qn);
  out.settings = Object.assign({ platformBlockCap: null, platformSource: "A1", mainSource: "A2", scopeCodes: { tiktok: 1, shopee: 2, lazada: 3 } }, out.settings || {});
  out.changelog = out.changelog || [];
  out.questions = out.questions.filter(q => !q.bankId || kbById(q.bankId)).map(q => {
    const b = q.bankId ? kbById(q.bankId) : null;
    return Object.assign({
      text: b ? b.text : "", type: b ? b.type : "SA", options: b ? b.options : [],
      sec: b ? b.sec : 15, topic: b ? b.topic : "other",
      source: b ? "reuse" : "new", ask: null, term: null,
    }, q, { source: b ? "reuse" : "new", adapted: !!(b && (q.text || q.options)) });
  });
  return out;
}

function blockOf(qn, q) { return qn.blocks.find(b => b.id === q.block) || { id: q.block, name: q.block, scope: "all" }; }

function optionsFor(qn, q) {
  if (q.pipe && q.type !== "GRID") {
    const src = qn.questions.find(x => x.id === q.pipe);
    return src ? src.options : q.options;
  }
  return q.options || [];
}

function evalCond(c, A) {
  if (!c) return true;
  if (c.all) return c.all.every(x => evalCond(x, A));
  if (c.any) return c.any.some(x => evalCond(x, A));
  if (c.not) return !evalCond(c.not, A);
  const v = A[c.q];
  if (v === undefined || v === null) return false;
  const arr = Array.isArray(v) ? v : [v];
  if (c.countOf) return c.countOf.filter(x => arr.includes(x)).length >= (c.gte || 1);
  if (c.has) return c.has.some(x => arr.includes(x));
  if (c.in) return c.in.some(x => arr.includes(x));
  return false;
}

function condLeaves(c, acc = []) {
  if (!c) return acc;
  if (c.all) c.all.forEach(x => condLeaves(x, acc));
  else if (c.any) c.any.forEach(x => condLeaves(x, acc));
  else if (c.not) condLeaves(c.not, acc);
  else acc.push(c);
  return acc;
}

function describeCond(qn, c) {
  if (!c) return "";
  if (c.all) return c.all.map(x => describeCond(qn, x)).join(" AND ");
  if (c.any) return c.any.map(x => describeCond(qn, x)).join(" OR ");
  if (c.not) return "NOT (" + describeCond(qn, c.not) + ")";
  const src = qn.questions.find(x => x.id === c.q);
  const opts = src ? optionsFor(qn, src) : [];
  const label = code => opts[code - 1] !== undefined ? opts[code - 1] : `code ${code} (no such option)`;
  if (c.countOf) return `${c.q}: ${c.gte}+ of ${c.countOf.map(label).join(", ")}`;
  const codes = c.has || c.in || [];
  const verb = c.has && src && src.type === "MA" ? "includes" : "=";
  return `${c.q} ${verb} ${codes.map(label).join(" or ")}`;
}

// Static checks: references to unknown or later questions, and option codes out of range.
function staticProblems(qn) {
  const out = [];
  const pos = Object.fromEntries(qn.questions.map((q, i) => [q.id, i]));
  qn.questions.forEach((q, i) => {
    for (const [kind, cond] of [["ask", q.ask], ["term", q.term]]) {
      for (const leaf of condLeaves(cond)) {
        if (!(leaf.q in pos)) { out.push({ qid: q.id, msg: `${kind} condition refers to ${leaf.q}, which is not in the questionnaire` }); continue; }
        if (kind === "ask" && pos[leaf.q] >= i) out.push({ qid: q.id, msg: `${kind} condition refers to ${leaf.q}, which comes later` });
        const src = qn.questions[pos[leaf.q]];
        const n = optionsFor(qn, src).length;
        const codes = (leaf.has || leaf.in || leaf.countOf || []);
        const bad = codes.filter(c => n && (c < 1 || c > n));
        if (bad.length) out.push({ qid: q.id, ref: leaf.q, msg: `refers to ${leaf.q} option ${bad.join(", ")}, but ${leaf.q} has only ${n} options` });
      }
    }
  });
  return out;
}

function rowsFor(qn, q, A) {
  if (q.type === "GRID" && q.pipe) {
    const v = A[q.pipe];
    const n = Array.isArray(v) ? v.length : 1;
    const cap = qn.settings && qn.settings.platformBlockCap;
    return q.loop && cap ? Math.min(n, cap) : n;
  }
  return 1;
}

// Walk one respondent through the questionnaire.
// answerFn(q, A, opts) returns the answer for an asked question.
function walk(qn, answerFn, ctx) {
  const A = {}, reached = [];
  let sec = 60; // introduction and consent
  const s = qn.settings || {};
  let allowedScopes = null;
  for (const q of qn.questions) {
    const block = blockOf(qn, q);
    if (block.scope !== "all") {
      const code = s.scopeCodes && s.scopeCodes[block.scope];
      if (code && s.platformBlockCap && allowedScopes === null) allowedScopes = chooseScopes(qn, A, ctx);
      if (allowedScopes && code && !allowedScopes.includes(block.scope)) continue;
    }
    if (!evalCond(q.ask, A)) continue;
    const val = answerFn(q, A, optionsFor(qn, q));
    A[q.id] = val;
    reached.push(q.id);
    sec += (q.sec || 15) * rowsFor(qn, q, A);
    if (q.term && evalCond(q.term, A)) return { A, reached, sec, terminatedAt: q.id };
  }
  if (allowedScopes && ctx) allowedScopes.forEach(sc => ctx.fill[sc] = (ctx.fill[sc] || 0) + 1);
  return { A, reached, sec, terminatedAt: null };
}

// Least-fill rotation: main platform block plus the least-filled others, up to the cap.
function chooseScopes(qn, A, ctx) {
  const s = qn.settings;
  const sel = [].concat(A[s.platformSource] || []);
  const scopes = Object.entries(s.scopeCodes).filter(([, c]) => sel.includes(c)).map(([k]) => k);
  const main = Object.entries(s.scopeCodes).find(([, c]) => c === A[s.mainSource]);
  const chosen = main && scopes.includes(main[0]) ? [main[0]] : [];
  const fill = (ctx && ctx.fill) || {};
  const rest = scopes.filter(x => !chosen.includes(x)).sort((a, b) => (fill[a] || 0) - (fill[b] || 0));
  while (chosen.length < s.platformBlockCap && rest.length) chosen.push(rest.shift());
  return chosen;
}

// Random-data generator that respects routing and only produces qualified completes.
function randomAnswerFn(rng, qn) {
  return function (q, A, opts) {
    const n = Math.max(1, opts.length);
    const tryAnswer = () => {
      if (q.pipe && q.type !== "GRID") {
        const sel = [].concat(A[q.pipe] || [1]);
        if (q.type === "MA") { const r = sel.filter(() => rng() < 0.5); return r.length ? r : [sel[0]]; }
        return sel[Math.floor(rng() * sel.length)];
      }
      if (q.type === "MA") { const r = []; for (let i = 1; i <= n; i++) if (rng() < 0.45) r.push(i); return r.length ? r : [1 + Math.floor(rng() * n)]; }
      if (q.type === "SA" || q.type === "SCALE") return 1 + Math.floor(rng() * n);
      return true;
    };
    let v = tryAnswer();
    if (q.term) for (let i = 0; i < 60 && evalCond(q.term, Object.assign({}, A, { [q.id]: v })); i++) v = tryAnswer();
    return v;
  };
}

function comboKey(qn, A) {
  const s = qn.settings;
  const sel = [].concat(A[s.platformSource] || []);
  const codes = Object.values(s.scopeCodes).filter(c => sel.includes(c)).sort();
  return codes.join("+") || "none";
}

function simulate(qn, personas, opts = {}) {
  const n = opts.n || 2000;
  const rng = mulberry32(opts.seed || 2611);
  const ans = randomAnswerFn(rng, qn);
  const ctx = { fill: {} };
  const reach = Object.fromEntries(qn.questions.map(q => [q.id, 0]));
  const combos = {}, byCount = {};
  let completes = 0;
  for (let i = 0; i < n; i++) {
    const r = walk(qn, ans, ctx);
    if (r.terminatedAt) continue;
    completes++;
    r.reached.forEach(id => reach[id]++);
    const key = comboKey(qn, r.A);
    const c = combos[key] = combos[key] || { n: 0, reach: {} };
    c.n++; r.reached.forEach(id => c.reach[id] = (c.reach[id] || 0) + 1);
    const cnt = key === "none" ? 0 : key.split("+").length;
    (byCount[cnt] = byCount[cnt] || []).push(r.sec / 60);
  }
  const loiByCount = Object.fromEntries(Object.entries(byCount).map(([k, v]) => [k, { n: v.length, mean: v.reduce((a, b) => a + b, 0) / v.length, max: Math.max(...v) }]));
  const pctx = { fill: {} };
  const personaRuns = (personas || []).map(p => {
    const r = walk(qn, (q) => p.answers && p.answers[q.id] !== undefined ? p.answers[q.id] : (q.type === "MA" ? [] : null), pctx);
    return { persona: p, reached: r.reached, loi: r.sec / 60, terminatedAt: r.terminatedAt, combo: comboKey(qn, r.A) };
  });
  return { n, completes, reach, combos, loiByCount, personaRuns, problems: staticProblems(qn) };
}

// ---------- Wording checks ----------

const JARGON = ["Shopee Mall", "LazMall", "KOL", "KOC", "affiliate", "P3M", "SEC", "social commerce"];
function lintQuestion(q) {
  const out = [];
  const t = q.text || "";
  if (/interviewer:|record /i.test(t)) return out;
  if ((q.type === "SA" || q.type === "SCALE") && /\b(satisf\w*|rate|agree|important|trust)\b/i.test(t) && /\band\b/i.test(t))
    out.push({ q: q.id, type: "double-barreled", severity: "medium", note: "Asks about two things at once. A respondent can't give one answer for both." });
  if (/\b(love|amazing|wonderful|excellent|don't you|wouldn't you|agree that)\b/i.test(t))
    out.push({ q: q.id, type: "leading", severity: "medium", note: "The wording assumes a positive answer." });
  const term = JARGON.find(j => t.includes(j));
  if (term && !/SHOW CARD/i.test(t))
    out.push({ q: q.id, type: "jargon", severity: "low", note: `"${term}" may not be understood. Define it or use a show card.` });
  if (t.split(/\s+/).length > 30)
    out.push({ q: q.id, type: "long", severity: "low", note: "Over 30 words. Hard to read aloud in the field." });
  return out;
}
const SEV_RANK = { critical: 4, high: 3, medium: 2, low: 1 };
function lint(qn, aiLint) {
  const found = [];
  qn.questions.forEach(q => found.push(...lintQuestion(q)));
  (aiLint || []).forEach(x => { const q = qn.questions.find(q => q.id === x.q); if (q && !q.fixed) found.push(Object.assign({ ai: true }, x)); });
  const byQ = {};
  for (const f of found) {
    const cur = byQ[f.q];
    if (!cur) { byQ[f.q] = Object.assign({ types: [f.type] }, f); continue; }
    if (!cur.types.includes(f.type)) cur.types.push(f.type);
    if (f.ai) { cur.note = f.note; cur.suggestion = f.suggestion; cur.ai = true; }
    if (SEV_RANK[f.severity] > SEV_RANK[cur.severity]) cur.severity = f.severity;
  }
  return Object.values(byQ);
}

// ---------- Pretest issues ----------

function detectIssues(qn, sim, aiLint) {
  const issues = [];
  const qs = qn.questions;
  const notesFor = ids => sim.personaRuns.flatMap(r => (r.persona.notes || []).filter(n => ids.includes(n.q)).map(n => ({ who: r.persona.name, text: n.comment })));
  const covered = new Set();
  const resolved = new Set((qn.changelog || []).flatMap(c => c.qids || []));

  // 1. Dead questions, grouped by block.
  const dead = qs.filter(q => sim.reach[q.id] === 0 && !sim.personaRuns.some(r => r.reached.includes(q.id)));
  const groups = {};
  dead.forEach(q => (groups[q.block] = groups[q.block] || []).push(q));
  for (const [bid, list] of Object.entries(groups)) {
    const block = blockOf(qn, list[0]);
    const prob = sim.problems.find(p => list.some(q => q.id === p.qid));
    const ids = list.map(q => q.id);
    const scopeCode = qn.settings.scopeCodes[block.scope];
    const users = scopeCode ? sim.personaRuns.filter(r => [].concat(r.persona.answers[qn.settings.platformSource] || []).includes(scopeCode)).length : 0;
    ids.forEach(id => covered.add(id));
    issues.push({ key: "dead:" + ids[0], sev: "critical", kind: "Logic",
      title: ids.length > 1 && qs.filter(q => q.block === bid).every(q => ids.includes(q.id)) ? `${block.name} block (${ids[0]}-${ids[ids.length - 1]}) is never asked` : ids.length > 1 ? `${ids.join(", ")} are never asked` : `${ids[0]} is never asked`,
      detail: (prob ? `The condition ${prob.msg}.` : "No path through the questionnaire meets the ask condition.") +
        ` 0 of ${sim.completes.toLocaleString()} test interviews reached it` + (users ? `, although ${users} of ${sim.personaRuns.length} personas use ${block.name}.` : ".") +
        (list[0].origin ? ` ${list[0].origin}` : ""),
      qids: ids, evidence: notesFor(ids), fixKey: "dead:" + ids[0] });
  }

  // 2. Narrow combination conditions on the platform question (coverage gaps).
  const src = qn.settings.platformSource;
  const multi = Object.entries(sim.combos).filter(([k]) => k.split("+").length >= 2);
  const multiN = multi.reduce((a, [, c]) => a + c.n, 0);
  qs.forEach(q => {
    if (covered.has(q.id) || !q.ask || !q.ask.all) return;
    const leaves = q.ask.all.filter(l => l.q === src && l.has);
    if (leaves.length < 2) return;
    const reachedMulti = multi.reduce((a, [, c]) => a + (c.reach[q.id] || 0), 0);
    const missed = multi.filter(([, c]) => !c.reach[q.id]).map(([k]) => k.split("+").map(c => optionsFor(qn, qs.find(x => x.id === src))[c - 1]).join(" + "));
    const follow = qs.filter(x => x.ask && condLeaves(x.ask).some(l => l.q === q.id)).map(x => x.id);
    const ids = [q.id, ...follow];
    ids.forEach(id => covered.add(id));
    const skipped = sim.personaRuns.filter(r => r.combo.split("+").length >= 2 && !r.reached.includes(q.id)).length;
    const multiP = sim.personaRuns.filter(r => r.combo.split("+").length >= 2).length;
    issues.push({ key: "gap:" + q.id, sev: "high", kind: "Coverage",
      title: `${ids.join("-")} reach only ${Math.round(100 * reachedMulti / Math.max(1, multiN))}% of multi-platform shoppers`,
      detail: `Asked only when ${describeCond(qn, q.ask)}. ${missed.join(", ")} shoppers are never asked` + (multiP ? ` (${skipped} of ${multiP} multi-platform personas skipped it).` : "."),
      qids: ids, evidence: notesFor(ids), fixKey: "gap:" + q.id });
  });

  // 3. Same topic asked to everyone and again in a platform block.
  const lints = lint(qn, aiLint);
  qs.forEach(b => {
    if (covered.has(b.id) || blockOf(qn, b).scope === "all") return;
    const a = qs.find(x => x.topic === b.topic && blockOf(qn, x).scope === "all" && x.id !== b.id);
    if (!a) return;
    const l = lints.find(x => x.q === b.id);
    covered.add(b.id);
    issues.push({ key: "dup:" + b.id, sev: "medium", kind: "Redundancy",
      title: `${b.id} repeats ${a.id} for ${blockOf(qn, b).name} users`,
      detail: `${a.id} already covers "${b.topic.replace(/-/g, " ")}" for every platform. ${b.id} asks ${blockOf(qn, b).name} users again.` + (l ? ` It is also ${l.types.join(" and ")}: ${l.note}` : ""),
      qids: [b.id, a.id], evidence: notesFor([b.id]), fixKey: "dup:" + b.id });
  });

  // 4. Interview length by number of platforms used.
  const over = Object.entries(sim.loiByCount).filter(([, v]) => v.mean > STUDY.loiCap).sort((x, y) => y[1].mean - x[1].mean);
  if (over.length) {
    const [cnt, v] = over[0];
    const hasPlatformBlocks = qn.blocks.some(b => b.scope !== "all");
    issues.push({ key: "loi:" + cnt, sev: "high", kind: "Length",
      title: cnt === "0" ? `Interviews average ${v.mean.toFixed(1)} min, over the ${STUDY.loiCap}-min cap` : `Shoppers on ${cnt} platforms average ${v.mean.toFixed(1)} min, over the ${STUDY.loiCap}-min cap`,
      detail: `Each platform block adds a full set of questions. ${v.n.toLocaleString()} of ${sim.completes.toLocaleString()} test interviews fall in this group.` +
        (hasPlatformBlocks && !qn.settings.platformBlockCap ? " Least-fill rotation of platform blocks would cap the length." : ""),
      qids: [], evidence: [], fixKey: hasPlatformBlocks && !qn.settings.platformBlockCap ? "loi:platforms" : "loi:" + cnt });
  }

  // 5. Wording problems not already covered.
  lints.forEach(l => {
    if (covered.has(l.q)) return;
    covered.add(l.q);
    issues.push({ key: "lint:" + l.q, sev: l.severity, kind: "Wording",
      title: `${l.q} is ${l.types.join(" and ")}`, detail: l.note + (l.suggestion ? ` Suggested: ${l.suggestion}` : ""),
      qids: [l.q], evidence: notesFor([l.q]), fixKey: "lint:" + l.q });
  });

  // 6. Persona feedback on questions nothing else flagged.
  const left = {};
  sim.personaRuns.forEach(r => (r.persona.notes || []).forEach(n => {
    if (covered.has(n.q) || resolved.has(n.q) || !qs.some(q => q.id === n.q)) return;
    (left[n.q] = left[n.q] || []).push({ who: r.persona.name, text: n.comment });
  }));
  Object.entries(left).forEach(([q, ev]) => issues.push({ key: "fb:" + q, sev: "low", kind: "Feedback",
    title: `Personas stumbled on ${q}`, detail: `${ev.length} persona${ev.length > 1 ? "s" : ""} commented on this question.`, qids: [q], evidence: ev, fixKey: "fb:" + q }));

  return issues.sort((a, b) => SEV_RANK[b.sev] - SEV_RANK[a.sev]);
}

// Apply a fix of shape {note, patch:[{id,set}], remove:[ids], add:[{after, question}], settings}.
function applyFix(qn, fix, label, qids) {
  const out = clone(qn);
  const touched = [];
  (fix.patch || []).forEach(p => { const q = out.questions.find(x => x.id === p.id); if (q) { Object.assign(q, p.set); q.fixed = true; touched.push(q.id); } });
  if (fix.remove) out.questions = out.questions.filter(q => !fix.remove.includes(q.id));
  (fix.add || []).forEach(a => {
    const q = Object.assign({ source: "new", ask: null, term: null, sec: 15, topic: "other", options: [] }, a.question, { fixed: true });
    if (q.bankId && kbById(q.bankId)) { const b = kbById(q.bankId); q.text = q.text || b.text; q.type = q.type || b.type; q.options = q.options && q.options.length ? q.options : b.options; q.source = "reuse"; }
    const i = out.questions.findIndex(x => x.id === a.after);
    out.questions.splice(i < 0 ? out.questions.length : i + 1, 0, q);
    touched.push(q.id);
  });
  if (fix.settings) Object.assign(out.settings, fix.settings);
  out.version = (out.version || 1) + 1;
  out.changelog.push({ version: out.version, label: label || "Fix", note: fix.note || "", touched, removed: fix.remove || [], qids: qids || touched });
  return out;
}

function summarize(qn) {
  const qs = qn.questions;
  const reuse = qs.filter(q => q.source === "reuse").length;
  return { total: qs.length, reuse, fresh: qs.length - reuse, reusePct: Math.round(100 * reuse / Math.max(1, qs.length)) };
}

// Offline template draft for a campaign with no recorded draft: reused bank questions only, picked by study type.
function templateDraft(c, brand) {
  const brands = [brand, "Competitor A", "Competitor B", "Competitor C", "None of these"];
  const blocks = [{ id: "S", name: "Screener", scope: "all" }];
  const questions = [
    { id: "S1", block: "S", bankId: "SCR-01", term: { q: "S1", in: [1, 5] } }, { id: "S2", block: "S", bankId: "SCR-02" },
    { id: "S3", block: "S", bankId: "SCR-03", term: { q: "S3", in: [5] } }, { id: "S4", block: "S", bankId: "SCR-04", term: { q: "S4", has: [1, 2, 3, 4] } },
  ];
  const add = (bid, name, items) => { blocks.push({ id: bid, name, scope: "all" }); items.forEach((it, i) => questions.push(Object.assign({ id: bid + (i + 1), block: bid }, it))); };
  const t = c.type;
  if (["Usage & attitude", "Purchase journey", "Tracker"].includes(t)) add("M", "Media and discovery", [{ bankId: "MED-01" }, { bankId: "MED-02" }, { bankId: "MED-04" }]);
  if (t !== "Customer satisfaction") add("B", "Brand funnel", [{ bankId: "BRD-01" }, { bankId: "BRD-02", options: brands },
    { bankId: "BRD-03", options: brands, ask: { q: "B2", has: [1, 2, 3, 4] } }, { bankId: "BRD-04", options: brands, ask: { q: "B2", has: [1, 2, 3, 4] } }]);
  if (t === "Customer satisfaction") add("N", "Satisfaction", [{ bankId: "SAT-03", text: `Overall, how satisfied are you with ${brand}?` }, { bankId: "SAT-01", text: `How likely are you to recommend ${brand} to a friend? (0-10)` }, { bankId: "SAT-02" }]);
  if (["Usage & attitude", "Purchase journey", "Concept test"].includes(t)) add("P", "Price", [{ bankId: "PRC-01" }, { bankId: "PRC-02" }]);
  add("D", "Demographics", [{ bankId: "DEM-01" }, { bankId: "DEM-02" }, { bankId: "DEM-03" }]);
  add("Z", "Closing", [{ bankId: "CLS-01" }]);
  return { version: 1, blocks, questions, settings: { platformSource: "none", mainSource: "none", scopeCodes: {} } };
}
