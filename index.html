const STOP = new Set("the and for with that this what about from have has are was were you your our their how why who when where which into over than then them they its can could would should does did not any all more most some such only also very just been being there here know tell show give find questions question ask asking".split(" "));
const stem = w => w.length > 4 ? w.replace(/(ings|ing|ers|ies|es|s)$/, m => m === "ies" ? "y" : "") : w;
const toks = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, " ").split(" ").filter(w => w.length > 2 && !STOP.has(w)).map(stem);
function retrieve(query) {
  ensureBank();
  const qt = [...new Set(toks(query))], ql = query.toLowerCase();
  const cl = S.clients.find(c => ql.includes(c.brand.toLowerCase()) || new RegExp(`\\b${c.code.toLowerCase()}\\b`).test(ql) || ql.includes(c.brand.split(" ")[0].toLowerCase()));
  const units = [];
  S.facts.forEach(d => d.chunks.forEach((t, i) => units.push({ kind: "fact", d, i, text: t, tok: toks(`${d.title} ${t}`) })));
  const { used } = bankUsage();
  KB.forEach(k => units.push({ kind: "q", k, text: k.text, tok: toks(`${k.text} ${k.topic} ${k.module} ${(k.options || []).join(" ")}`) }));
  const N = units.length, avg = units.reduce((a, u) => a + u.tok.length, 0) / N, df = {};
  units.forEach(u => new Set(u.tok).forEach(t => df[t] = (df[t] || 0) + 1));
  units.forEach(u => {
    let s = 0;
    qt.forEach(t => { const tf = u.tok.filter(x => x === t).length; if (tf) s += Math.log(1 + N / ((df[t] || 0) + 0.5)) * tf * 2.2 / (tf + 1.2 * (0.25 + 0.75 * u.tok.length / avg)); });
    if (cl && u.kind === "fact" && u.d.client === cl.id) s = s * 1.6 + 1;
    if (cl && u.kind === "q" && (used[u.k.id] || []).some(cid => camp(cid).clientId === cl.id)) s *= 1.3;
    u.score = s;
  });
  const rank = kind => units.filter(u => u.kind === kind && u.score > 0.4).sort((a, b) => b.score - a.score);
  const facts = [], seenDoc = {};
  rank("fact").forEach(u => { if (facts.length < 5 && (seenDoc[u.d.id] || 0) < 2) { facts.push(u); seenDoc[u.d.id] = (seenDoc[u.d.id] || 0) + 1; } });
  return { client: cl, facts, questions: rank("q").slice(0, 5).map(u => u.k) };
}
function replayAnswer(r) {
  if (!r.facts.length && !r.questions.length) return [{ text: "Nothing in the knowledge base matches that yet. Try a client, market or topic, or add documents to Facts." }];
  const out = [{ text: `Found ${r.facts.length} fact${r.facts.length === 1 ? "" : "s"} and ${r.questions.length} bank question${r.questions.length === 1 ? "" : "s"}${r.client ? ` for ${r.client.brand}` : ""}.` }];
  if (r.facts.length) out.push({ text: `Most relevant: ${r.facts[0].text}`, cite: r.facts[0].d.id });
  return out;
}
async function actAsk(query) {
  query = String(query || "").trim();
  if (!query) return;
  const r = retrieve(query);
  S.ask = { q: query, r, answer: null, src: null };
  rerender();
  const res = await runAI("ask", {
    steps: ["Searching facts and the Question Bank…"],
    live: (p, signal) => S.sample.json(`You answer a market researcher's question using only the knowledge-base passages below. Be brief and factual: 2-4 sentences. Every sentence cites the document id it comes from. If the passages don't answer the question, say so. Then pick the bank questions (by id) that would help a questionnaire on this topic.

RESEARCHER'S QUESTION: ${query}

PASSAGES (document id | title | text)
${r.facts.map(f => `${f.d.id} | ${f.d.title} | ${f.text}`).join("\n") || "(none)"}

BANK QUESTIONS (id | text)
${r.questions.map(k => `${k.id} | ${k.text}`).join("\n") || "(none)"}

Reply with only JSON: {"answer":[{"text":"...","cite":"DOC-001"}],"questions":["ECO-01"]}`, { modelTier: "quick", signal, onText: () => p("Writing…") })
      .then(raw => {
        const ids = r.facts.map(f => f.d.id), qids = r.questions.map(k => k.id);
        const answer = (raw && Array.isArray(raw.answer) ? raw.answer : []).filter(a => a && a.text).map(a => ({ text: String(a.text), cite: ids.includes(a.cite) ? a.cite : undefined }));
        if (!answer.length) throw { code: "bad_output", message: "The AI agent's answer was empty. Try again." };
        const pick = (raw.questions || []).filter(id => qids.includes(id));
        return { answer, questions: pick.length ? pick.concat(qids.filter(id => !pick.includes(id))) : qids };
      }),
    replay: () => ({ answer: replayAnswer(r), questions: r.questions.map(k => k.id) }),
    done: () => "Answered",
  });
  if (!res || !S.ask || S.ask.q !== query) return;
  S.ask.answer = res.result.answer; S.ask.qorder = res.result.questions; S.ask.src = res.src;
  rerender();
}

// Smart Survey Platform reports: interview data with live sync, the campaign and client dashboards

// ---------- Interview data ----------
// Each campaign with fieldwork has a pool of interviews in sync order. Field QC and every report read the
// synced part, and campaigns in field sync new interviews every few seconds while the page is open.

const POOL = {};

const addDays = (iso, k) => isoUTC(utc(iso) + k * 864e5);
const daysBetween = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);

}

  (cities.length ? cities : ["HCMC"]).forEach((city, _, all) => {
    const nCity = Math.round(total / all.length), m = Math.max(1, Math.round(nCity / 60));
    for (let i = 0; i < m; i++) out.push([`INT-${base + out.length}`, city, Math.round(nCity / m)]);

}

function pool(cid) {

function qcState(cid) {

  const qc = p.qcCache.qc, ws = cid === S.cid ? S : S.ws[cid];

// New interviews arrive every few seconds for campaigns in field.
setInterval(() => {

    const p = pool(c.id);
    if (!p || p.synced >= p.rows.length) return;
    p.synced = Math.min(p.rows.length, p.synced + 1 + Math.floor(Math.random() * 2));
    p.lastSync = Date.now();

    c.spent = Math.round(p.spent0 + (p.synced - p.synced0) * c.budget / Math.max(1, c.n) * 0.9);

function dailyChart(c, rows) {
  const counts = {};
  rows.forEach(r => counts[r.date] = (counts[r.date] || 0) + 1);
  const start = [c.fieldStart, ...Object.keys(counts)].sort()[0], end = [c.fieldEnd, ...Object.keys(counts)].sort().pop();
  const days = Array.from({ length: daysBetween(start, end) + 1 }, (_, i) => addDays(start, i));
  const max = Math.max(10, ...Object.values(counts)), W = 520, padL = 30, padR = 8, top = 12, H = 170, base = H - 24;
  const bw = (W - padL - padR) / days.length, y = v => base - (base - top) * v / max;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Completes by day">`;
  const step = max > 60 ? 20 : max > 30 ? 10 : 5;
  for (let t = 0; t <= max; t += step) s += `<line class="gridline" x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"/><text x="${padL - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  let cum = 0;
  const ti = days.indexOf(TODAY), every = Math.ceil(days.length / 8);
  days.forEach((dd, i) => {
    const v = counts[dd] || 0; cum += v;
    const x = padL + i * bw + 1, w = Math.max(2, bw - 2), p = pd(dd);
    if (v) s += `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${(base - y(v)).toFixed(1)}" rx="${Math.min(3, w / 2)}" fill="var(--s1)"${dd === TODAY && c.status === "In field" ? ' fill-opacity="0.6"' : ""} data-tip="${p.d} ${MONTHS[p.m - 1]}: ${v} interviews (${cum} so far)"/>`;
    if ((i % every === 0 && (ti < 0 || Math.abs(i - ti) > 1)) || i === ti) s += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle"${dd === TODAY ? ' style="fill:var(--ink);font-weight:600"' : ""}>${dd === TODAY ? "Today" : p.d + " " + MONTHS[p.m - 1]}</text>`;
  });
  return s + "</svg>";
}

function sampleProfile(p, st) {

function qCard(t) {
  if (!t.n) return "";
  if (t.kind !== "scale") t.rows = t.rows.filter(r => r.total > 0 || r.summary);
  const multi = t.cols.length > 1;
  const head = `<div class="qc-head"><span class="mono qid">${h(t.id)}</span><span class="qc-text">${h(shortQ(t.text))}</span></div><div class="qc-meta"><span class="chip type">${h(t.type)}</span><span>n=${t.n.toLocaleString()}</span>${t.note ? info(t.note) : ""}</div>`;
  let body;
  if (t.kind === "oe") body = `<ul class="verbatims">${t.samples.map(x => `<li>“${h(x)}”</li>`).join("")}</ul>`;
  else if (t.kind === "num") body = multi ? xtab(t, [["Mean", t.stats.mean], ["Median", t.stats.median]], v => Math.round(v).toLocaleString())
    : `<div class="qc-big"><b>${Math.round(t.stats.mean[0]).toLocaleString()}</b><span>mean · median ${Math.round(t.stats.median[0]).toLocaleString()}</span></div>`;
  else if (!multi) {
    const lead = t.kind === "nps" ? `<div class="qc-big"><b>${t.stats.nps[0] > 0 ? "+" : ""}${t.stats.nps[0]}</b><span>NPS</span></div>` : t.kind === "scale" ? `<div class="qc-big"><b>${t.stats.mean[0].toFixed(1)}</b><span>mean · ${pct(t.rows.find(r => r.summary).total)} top 2 box</span></div>` : "";
    body = lead + `<div class="hbars">${t.rows.filter(r => !r.summary).map(r => hbar(r.label, r.total, `${r.label}: ${pct(r.total, 1)} of ${r.n}${r.mean ? ` · mean ${r.mean.toFixed(1)}` : ""}`, r.mean ? `<span class="muted"> · ${r.mean.toFixed(1)}</span>` : "")).join("")}</div>`;
  } else body = xtab(t, t.kind === "nps" ? [["NPS", t.stats.nps]] : t.kind === "scale" ? [["Mean", t.stats.mean]] : [], t.kind === "nps" ? v => (v > 0 ? "+" : "") + v : v => v.toFixed(1));
  return `<article class="qcard" id="qc-${h(t.id)}">${head}${body}</article>`;
}
function xtab(t, extra, fmt) {
  const small = t.cols.some(c => c.n < 30);
  return `<div class="tbl-wrap"><table class="xt"><thead><tr><th></th>${t.cols.map(c => `<th class="n">${h(c.label)}${c.letter ? ` <span class="mono">${c.letter}</span>` : ""}</th>`).join("")}</tr></thead><tbody>
    ${t.rows.map(r => `<tr${r.summary ? ' class="base"' : ""}><td>${h(r.label)}</td><td class="n">${pct(r.total)}</td>${r.cells.map(c => `<td class="n">${pct(c.pct)}${c.letters ? `<span class="sig">${c.letters}</span>` : ""}</td>`).join("")}</tr>`).join("")}
    ${extra.map(([l, vals]) => `<tr class="base"><td>${l}</td>${vals.map(v => `<td class="n">${v === null || v === undefined ? "n/a" : fmt(v)}</td>`).join("")}</tr>`).join("")}
    <tr class="base"><td>Base</td>${t.cols.map(c => `<td class="n">${c.n}${c.n < 30 ? "*" : ""}</td>`).join("")}</tr></tbody></table></div>${small ? '<p class="chart-cap">* Under 30: not tested.</p>' : ""}`;
}

async function actCode(cid) {
  const st = qcState(cid), an = analyze(st.rows, st.ints, st.cases), sample = an.base.slice(0, 80);
  const r = await runAI("code", {
    steps: ["Applying the approved codeframe…", "Scoring confidence…"],
    live: (p, signal) => S.sample.json(`Code these open-ended answers to "Why do you prefer your main platform over other platforms for buying skincare?" using the approved codeframe. An answer can get more than one code. Use C99 only if an answer is too vague to code. Give a confidence from 0 to 1 for each answer.

CODEFRAME
${CODEFRAME.map(c => `${c.code} ${c.label}`).join("\n")}

ANSWERS (id: text)
${sample.map(r => `${r.id}: ${r.oe}`).join("\n")}

Reply with only a JSON array: [{"id":12,"codes":["C1","C4"],"conf":0.92}]`, { modelTier: "default", signal, onText: ({ text }) => p(`Coded ${(text.match(/"id"\s*:/g) || []).length} of ${sample.length}`) }),
    replay: () => replayCoding(sample),
    done: res => `Coded ${Array.isArray(res) ? res.length : 0} answers`,
  });
  if (!r) return;
  const coded = (Array.isArray(r.result) ? r.result : []).filter(c => c && c.id !== undefined).map(c => ({ id: Number(c.id), codes: (Array.isArray(c.codes) ? c.codes : [c.codes]).map(String), conf: clampNum(c.conf, 0, 1, 0.5) }));
  S.coding[cid] = { coded, src: r.src, agree: codingAgreement(coded, sample) };
  if (S.view === "report") renderCampaignReport();
}

function trackedCard(list) {
  const sets = list.map(c => { const p = pool(c.id), st = qcState(c.id); return { c, vals: Object.fromEntries(Object.keys(TRACK).map(b => [b, trackValue(p.qn, b, st.kept, p.answers)])) }; });
  const rows = Object.keys(TRACK).map(b => ({ b, pts: sets.filter(s => s.vals[b]).map(s => ({ c: s.c, v: s.vals[b] })) })).filter(r => r.pts.length >= 2);
  const tip = "Questions reused from the bank are asked the same way in every campaign, so results can be compared. The change compares the latest campaign with the one before (two-proportion test, 95%).";
  if (!rows.length) {
    const km = (() => { const s = sets[sets.length - 1], p = pool(s.c.id); return keyMetrics(p.qn, qcState(s.c.id).kept, p.answers); })();
    return `<section class="card">${cardHead("Tracked across campaigns", "", tip)}${emptyState("chart", "One campaign with results so far", `Tracking starts when a second campaign reuses the same bank questions.${km.length ? ` Latest: ${km.map(m => `${m.label} ${fmtMetric(m)}`).join(", ")}.` : ""}`)}</section>`;
  }
  return `<section class="card">${cardHead("Tracked across campaigns", `<span class="sub">${rows.length} bank questions</span>`, tip)}
    <div class="tbl-wrap"><table class="track"><thead><tr><th>Measure</th>${sets.map(s => `<th class="n"><span class="mono">${h(s.c.id)}</span><div class="small muted">${MONTHS[pd(s.c.fieldStart).m - 1]} ’${String(pd(s.c.fieldStart).y).slice(2)}</div></th>`).join("")}<th></th><th class="n">Change</th></tr></thead>
    <tbody>${rows.map(r => {
      const a = r.pts[r.pts.length - 2].v, b = r.pts[r.pts.length - 1].v, dlt = Math.round((b.p - a.p) * 100), sig = propDiffSig(a, b);
      return `<tr><td>${h(r.pts[0].v.label)}</td>${sets.map(s => { const x = s.vals[r.b]; return `<td class="n">${x ? pct(x.p) : "–"}${x && s.c.status === "In field" ? '<span class="small muted"> so far</span>' : ""}</td>`; }).join("")}<td>${spark(r.pts.map(x => x.v.p))}</td>
        <td class="n"><span class="delta${sig ? " sig" : ""}" data-tip="${sig ? "Significant at 95%" : "Not significant at 95%"} · n=${a.n} vs ${b.n}">${dlt > 0 ? "▲ +" : dlt < 0 ? "▼ " : ""}${dlt} pts</span></td></tr>`;
    }).join("")}</tbody></table></div>
    <p class="chart-cap">Bold change: significant at 95%. Values are QC-passed shares.</p></section>`;
}
function spark(vals) {
  const W = 64, H = 22, lo = Math.min(...vals), hi = Math.max(...vals), span = Math.max(0.05, hi - lo);
  const pts = vals.map((v, i) => [4 + i * (W - 8) / Math.max(1, vals.length - 1), H - 4 - (H - 8) * (v - lo) / span]);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="var(--s1)" stroke-width="2"/>${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--s1)" stroke="var(--panel)" stroke-width="1.5"/>`).join("")}</svg>`;
}
function clientVolumes() {

function methodLine(x) {
  return `${x.n.toLocaleString()} QC-passed interviews (${x.excluded} excluded in field QC) · ${x.c.method} · ${x.c.cities.join(", ")} · ${fmtRange(x.c.fieldStart, x.c.fieldEnd)}`;
}

// The largest significant gaps between age groups or cities, one per question.
function autoFindings(x, k) {
  const cands = [];
  x.qn.questions.forEach(q => {
    if (SKIP_BLOCKS.test(q.block) || q.pipe || !["SA", "MA", "SCALE"].includes(q.type)) return;
    ["age", "city"].forEach(kind => {
      const t = tabQuestion(x.qn, q, x.rows, x.ans, kind);
      if (t.kind === "nps") return;
      t.rows.forEach(r => {
        if (TAIL.test(r.label) || (t.kind === "scale" && !r.summary)) return;
        r.cells.forEach((cell, j) => cell.letters.split("").forEach(L => {
          const lo = t.cols.findIndex(cc => cc.letter === L);
          if (lo > 0) cands.push({ q, t, kind, row: r, hi: t.cols[j + 1], lo: t.cols[lo], pHi: cell.pct, pLo: r.cells[lo - 1].pct });
        }));
      });
    });
  });
  cands.sort((a, b) => (b.pHi - b.pLo) - (a.pHi - a.pLo));
  const used = new Set(), out = [];
  for (const f of cands) { if (used.has(f.q.id)) continue; used.add(f.q.id); out.push(f); if (out.length === k) break; }
  return out;
}
const groupName = (kind, col) => kind === "age" ? `${col.label}s` : `${col.label} respondents`;

function genericDoc(x) {
  const km = keyMetrics(x.qn, x.rows, x.ans), fs = autoFindings(x, 3);
  const nq = x.qn.questions.find(q => q.bankId === "SAT-01"), oe = x.qn.questions.find(q => q.bankId === "SAT-02");
  const findings = [];
  let headline;
  if (nq && km[0] && km[0].fmt === "nps") {
    const t = tabQuestion(x.qn, nq, x.rows, x.ans, "total"), det = t.rows[2].total, pro = t.rows[0].total;
    headline = `${x.interim ? "Interim read: " : ""}NPS is ${fmtMetric(km[0])}, with ${pct(det)} of visitors unlikely to recommend ${x.cl.brand}`;
    findings.push({ title: `NPS ${fmtMetric(km[0])}: ${pct(pro)} promoters, ${pct(det)} detractors`, body: `${pct(pro)} would recommend ${x.cl.brand} (9-10) and ${pct(det)} would not (0-6)${km[1] && km[1].label === "Satisfied" ? `. ${pct(km[1].value)} are satisfied with the visit overall` : ""}.`, cite: [nq.id].concat(km[1] && km[1].label === "Satisfied" ? [km[1].qid] : []) });
  } else if (km.length) {
    headline = `${x.interim ? "Interim read: " : ""}${km.slice(0, 2).map(m => `${pct(m.value)} ${m.label.replace(/^(\w)/, s => s.toLowerCase())}`).join(", ")}`;
    findings.push({ title: `${km[0].label}: ${fmtMetric(km[0])}`, body: km.map(m => `${m.label} ${fmtMetric(m)}${m.note ? ` (${m.note})` : ""}`).join("; ") + ".", cite: km.map(m => m.qid) });
  }
  fs.forEach(f => {
    const hi = groupName(f.kind, f.hi), lo = groupName(f.kind, f.lo), ans = f.row.summary ? "4 or 5" : `"${f.row.label}"`;
    findings.push({
      title: f.row.summary ? `${capFirst(hi)} rate ${shortQ(f.q.text).replace(/^how\s+/i, "").toLowerCase()} higher` : `More ${hi} answer "${f.row.label}"`,
      body: `Asked "${shortQ(f.q.text)}", ${pct(f.pHi)} of ${hi} answered ${ans}, against ${pct(f.pLo)} of ${lo}. The gap is significant at 95%.`, cite: [f.q.id],
    });
  });
  if (!headline) headline = findings[0] ? findings[0].title : `${x.n} interviews so far`;
  const implications = [
    ...(oe ? [`Read the reasons behind low scores (${oe.id}) with the operations team before fieldwork closes.`] : []),
    ...fs.slice(0, 1).map(f => `Plan a separate read-out for ${groupName(f.kind, f.hi)}: they differ most from ${groupName(f.kind, f.lo)} (${f.q.id}).`),
    "Keep the bank questions in the next wave so these results can be tracked.",
  ].slice(0, 3);
  const caveats = [`Base: ${x.n} QC-passed interviews; ${x.excluded} excluded in field QC.`, "Unweighted. Quotas controlled city, age and gender only."];
  if (x.interim) caveats.unshift(`Fieldwork is still running: ${x.p.synced} of ${x.c.n} interviews so far, so figures will move.`);
  return { headline, findings: findings.slice(0, 4), implications, caveats, kpis: km.slice(0, 3).map(m => ({ label: m.label, value: fmtMetric(m), note: m.note || "" })), method: methodLine(x), n: x.n, figure: fs[0] ? { qid: fs[0].q.id, kind: fs[0].kind } : nq ? { qid: nq.id, kind: "total" } : null };
}

function lbDoc(x) {
  const an = analyze(x.st.rows, x.st.ints, x.st.cases), t = an.tables, row = (T, l) => T.rows.find(r => r.label === l);
  const tt = row(t.T1, "TikTok Shop"), sh = row(t.T1, "Shopee"), lz = row(t.T1, "Lazada");
  const d = l => row(t.T2, l).cells, rs = l => row(t.T3, l).cells, luma = t.T4.brands[0], hana = t.T4.brands[1], lzN = t.T2.cols[3].n;
  const ttYoungSig = tt.cells[0].letters.includes("C");
  return {
    headline: "TikTok Shop drives discovery for under-25s, but Shopee still closes most skincare purchases",
    kpis: [{ label: "Buy skincare on Shopee", value: pct(sh.total), note: "past 3 months" }, { label: "18-24s on TikTok Shop", value: pct(tt.cells[0].pct), note: `vs ${pct(tt.cells[2].pct)} of 35-45s` }, { label: "LumaBeauty conversion", value: pct(luma.conv), note: "bought / aware" }],
    findings: [
      { title: "Shopee is the default; TikTok Shop skews young", cite: ["T1"], body: `Shopee reaches ${pct(sh.total)} of online skincare buyers. TikTok Shop reaches ${pct(tt.total)} overall and ${pct(tt.cells[0].pct)} of 18-24s${ttYoungSig ? `, significantly more than 35-45s (${pct(tt.cells[2].pct)})` : ` versus ${pct(tt.cells[2].pct)} of 35-45s`}. Lazada reaches ${pct(lz.total)}, rising with age.` },
      { title: "TikTok Shop sells through content; Shopee through search and vouchers", cite: ["T2"], body: `${pct(d("Short video")[0].pct + d("Livestream")[0].pct)} of TikTok Shop-first buyers found their last product in a short video or livestream. Shopee-first buyers mostly started from in-app search (${pct(d("In-app search")[1].pct)}) or a voucher page (${pct(d("Voucher / flash-sale page")[1].pct)}).` },
      { title: "Price wins on Shopee; trust wins on Lazada", cite: ["T3"], body: `Low prices and vouchers is the top reason to prefer Shopee (${pct(rs("Low prices and vouchers")[1].pct)}). Lazada-first buyers cite authentic products and official stores most (${pct(rs("Authentic products, official stores")[2].pct)}), from a small base (n=${lzN}).` },
      { title: "LumaBeauty loses people between awareness and purchase", cite: ["T4"], body: `${pct(luma.aware)} know LumaBeauty, ${pct(luma.consider)} would consider it and ${pct(luma.bought)} bought it in the past 3 months: ${pct(luma.conv)} of those aware. Hana Glow converts ${pct(hana.conv)}.` },
    ],
    implications: ["Put launch money into TikTok creators and livestreams to reach 18-24s.", "Keep strong search and voucher visibility on Shopee, where purchases close.", "Lead with official-store and authenticity cues on Lazada and with older buyers."],
    caveats: [`Base: ${an.n} QC-passed interviews; ${x.st.rows.length - an.n} removed in field QC${x.st.ints.length ? ` (including all ${x.st.ints.join(", ")} interviews)` : ""}.`, "Unweighted. Quotas controlled gender, age and city, not platform use.", `Lazada-first buyers are a small base (n=${lzN}). Treat as directional.`],
    method: methodLine(Object.assign({}, x, { n: an.n, excluded: x.st.rows.length - an.n })), n: an.n, figure: { table: "T1" },
  };
}
function storedDoc(x, r) {
  return { headline: r.headline, findings: r.findings.map(f => ({ title: f.title, body: f.body, cite: [] })), implications: [], caveats: [`${x.c.achieved.toLocaleString()} interviews · ${pct(r.excludedPct, 1)} excluded in QC · average length ${r.loi.toFixed(1)} min.`],
    kpis: [{ label: "Completes", value: x.c.achieved.toLocaleString(), note: `target ${x.c.n}` }, { label: "Average length", value: r.loi.toFixed(1) + " min", note: `cap ${x.c.loiCap} min` }, { label: "Excluded in QC", value: pct(r.excludedPct, 1), note: "" }],
    method: methodLine(x), n: x.n, figure: null, delivered: r.delivered };
}
const NEXT_STEPS = {
  "LB-2611": ["Run a 4-week TikTok creator test with 18-24s and track Shopee search for LumaBeauty during it.", "Fix the awareness-to-purchase leak first: test official-store badges and vouchers with people who know the brand.", "Re-run the brand funnel (bank questions) in the next wave to measure the change."],
};
const ALT_HEADLINES = { "LB-2611": ["Win discovery on TikTok, close the sale on Shopee", "LumaBeauty is known but not bought: the fix is at the point of purchase"] };
function nextSteps(x, doc) {
  return NEXT_STEPS[x.c.id] || [`Share the ${doc.findings.length} findings with ${x.cl.brand}'s team and agree owners for each.`, "Keep the same bank questions in the next wave so the change can be tested.", ...(x.interim ? ["Re-run this summary when fieldwork closes."] : [])];
}
function altHeadlines(x, doc) { return ALT_HEADLINES[x.c.id] || doc.findings.map(f => f.title); }

function execState(cid) { return S.exec[cid] || null; }
const curDoc = X => X.versions[X.cur].doc;
function pushVersion(cid, doc, label, src) {
  const X = S.exec[cid] = S.exec[cid] || { versions: [], cur: -1, chat: [], approved: null };
  X.versions = X.versions.slice(0, X.cur + 1);
  X.versions.push({ doc, label, src });
  X.cur = X.versions.length - 1;
  X.approved = null;
}

function tabText(t) {
  if (t.kind === "oe") return `${t.id} ${shortQ(t.text)} (open-ended, n=${t.n}). Sample answers: ${t.samples.join(" | ")}`;
  if (t.kind === "num") return `${t.id} ${shortQ(t.text)} (n=${t.n}). Mean ${Math.round(t.stats.mean[0])}, median ${Math.round(t.stats.median[0])}.`;
  return `${t.id} ${shortQ(t.text)} (${t.note || "column %"})\nRow | ${t.cols.map(c => `${c.label}${c.letter ? ` (${c.letter})` : ""} n=${c.n}`).join(" | ")}\n` +
    t.rows.map(r => `${r.label} | ${pct(r.total)} | ${r.cells.map(c => pct(c.pct) + (c.letters ? " " + c.letters : "")).join(" | ")}`).join("\n") + (t.kind === "nps" ? `\nNPS | ${t.stats.nps.join(" | ")}` : "");
}
function dataText(x) {
  if (seedOf(x.c.id).analysis) { const an = analyze(x.st.rows, x.st.ints, x.st.cases); return { text: Object.values(an.tables).map(tableText).join("\n\n"), cites: ["T1", "T2", "T3", "T4"], hint: 'table IDs such as "T1"' }; }
  const qs = x.qn.questions.filter(q => !/^(S|Z)$/.test(q.block)).slice(0, 24);
  return { text: qs.map(q => tabText(tabQuestion(x.qn, q, x.rows, x.ans, "age"))).join("\n\n"), cites: x.qn.questions.map(q => q.id), hint: 'question IDs such as "' + (qs[0] ? qs[0].id : "Q1") + '"' };
}
function studyLine(x) {
  return `${x.c.name} for ${x.cl.brand} (${x.c.id}). ${x.c.method}, ${x.c.cities.join(", ")}. Base: ${x.n} QC-passed interviews (${x.excluded} removed in field QC). Fieldwork ${fmtRange(x.c.fieldStart, x.c.fieldEnd)}. Unweighted.${x.interim ? ` Fieldwork is still running: ${x.p.synced} of ${x.c.n} interviews so far.` : ""}`;
}
function normalizeDoc(raw, cites, base) {
  if (!raw || !raw.headline || !Array.isArray(raw.findings)) throw { code: "bad_output", message: "The AI agent's summary was incomplete. Try again." };
  return Object.assign({}, base, { headline: String(raw.headline),
    findings: raw.findings.filter(f => f && f.title).slice(0, 6).map(f => ({ title: String(f.title), body: String(f.body || ""), cite: (Array.isArray(f.cite) ? f.cite : []).map(String).filter(c => cites.includes(c)) })),
    implications: (raw.implications || []).map(String).slice(0, 5), caveats: (raw.caveats || []).map(String).slice(0, 4) });
}

async function actExecGenerate(cid) {
  const x = insightPack(cid), d = seedOf(cid);
  const base = seedOf(cid).analysis ? lbDoc(x) : genericDoc(x);

  const r = await runAI("xsum", {
    steps: ["Reading QC-passed tables…", "Finding significant differences…", "Drafting findings with citations…"],
    live: (p, signal) => askJSON(`You are a research director writing the executive summary of a quantitative study for the client.

STUDY: ${studyLine(x)}

TABLES (column %; a letter after a value marks it as significantly higher than the column with that letter at 95% confidence)
${data.text}

Rules: use only numbers that appear in the tables. Every finding cites the ${data.hint} it rests on. Call a difference significant only where the letters show it. Plain, direct sentences. Give 3-4 findings, 3 implications for the client and 2-3 caveats.

Reply with only JSON:
{"headline":"...","findings":[{"title":"...","body":"...","cite":["${data.cites[0]}"]}],"implications":["..."],"caveats":["..."]}`, "default", p, signal, () => "Writing…").then(raw => normalizeDoc(raw, data.cites, base)),
    replay: () => base,
    done: () => "Summary drafted",
  });
  if (!r) return;
  pushVersion(cid, r.result, "Drafted from the tables", r.src);
  S.exec[cid].chat = [{ who: "ai", src: r.src, text: `I drafted this from ${x.n} QC-passed interviews. Every finding cites its table. Ask me to change anything, then approve and export.` }];

function replayEdit(x, doc, text) {
  const t = text.toLowerCase(), out = clone(doc);
  let m;
  if ((m = t.match(/(?:remove|drop|delete)\s+(?:the\s+)?(?:finding\s*)?#?(\d)/))) {
    const i = Number(m[1]) - 1;
    if (!out.findings[i]) return { reply: `There's no finding ${m[1]}.` };
    const [f] = out.findings.splice(i, 1);
    return { reply: `Removed finding ${m[1]}, "${f.title}".`, doc: out, label: `Removed finding ${m[1]}` };
  }
  if (/short|concise|brief|trim|tight|cut/.test(t)) {
    out.findings = out.findings.slice(0, 3).map(f => Object.assign({}, f, { body: (f.body.match(/^.*?[.!?](?=\s|$)/) || [f.body])[0] }));
    out.implications = out.implications.slice(0, 2);
    return { reply: "Cut to three findings of one sentence each and kept the two strongest implications.", doc: out, label: "Shortened" };
  }
  if (/next step|recommend|action|implication/.test(t)) {
    const add = nextSteps(x, out).filter(s => !out.implications.includes(s)).slice(0, 2);
    if (!add.length) return { reply: "The implications already include every next step the data supports." };
    out.implications = out.implications.concat(add);
    return { reply: `Added ${add.length} next step${add.length === 1 ? "" : "s"} to the implications.`, doc: out, label: "Added next steps" };
  }
  if (/headline|title|cmo|ceo|board|punch/.test(t)) {
    const alt = altHeadlines(x, out).find(hd => hd !== out.headline);
    if (!alt) return { reply: "I don't have another headline the data supports." };
    out.headline = alt;
    return { reply: "Rewrote the headline to lead with the action.", doc: out, label: "New headline" };
  }
  return { reply: 'In Replay I can shorten the summary, add next steps, rewrite the headline or remove a finding (for example "remove finding 2"). Switch to Live AI for any other edit.' };
}

async function actExecChat(cid, text) {
  const X = S.exec[cid], x = insightPack(cid), doc = curDoc(X);
  X.chat.push({ who: "me", text });
  renderExec();
  const data = dataText(x);
  const r = await runAI("xchat", {
    steps: ["Reading your request…", "Editing the summary…"],
    live: (p, signal) => S.sample.json(`You are editing the executive summary of a market research study with the researcher who owns it.

STUDY: ${studyLine(x)}

DATA (the only source for numbers; a letter marks a value significantly higher than that column at 95%)
${data.text}

CURRENT SUMMARY (JSON)
${JSON.stringify({ headline: doc.headline, findings: doc.findings, implications: doc.implications, caveats: doc.caveats })}

RECENT CONVERSATION
${X.chat.slice(-6, -1).map(m => `${m.who === "me" ? "Researcher" : "You"}: ${m.text}`).join("\n") || "(none)"}

RESEARCHER'S REQUEST: ${text}

Change the summary as asked. Keep every number traceable to the data and keep citations (${data.hint}) on findings. If the request needs data that is not shown, say so and return the summary unchanged.

Reply with only JSON: {"reply":"one or two sentences on what you changed","label":"2-4 word change label","summary":{"headline":"...","findings":[{"title":"...","body":"...","cite":["..."]}],"implications":["..."],"caveats":["..."]}}`, { modelTier: "default", signal, cache: false, onText: () => p("Editing…") })

    replay: () => replayEdit(x, doc, text),
    done: () => "Done",
  });
  if (!r) { X.chat.push({ who: "ai", text: "That didn't go through. Try again." }); renderExec(); return; }
  const res = r.result;
  const changed = res.doc && JSON.stringify(res.doc) !== JSON.stringify(doc);
  if (changed) pushVersion(cid, res.doc, res.label || "Edited", r.src);
  X.chat.push({ who: "ai", src: r.src, text: res.reply + (changed ? ` Saved as v${X.cur + 1}.` : "") });
  renderExec();
}

    ${docFigure(c, d)}
    ${d.implications.length ? `<h3>Implications</h3><ul>${d.implications.map(x => `<li>${h(x)}</li>`).join("")}</ul>` : ""}
    ${d.caveats.length ? `<h3>Method and caveats</h3><ul class="muted">${d.caveats.map(x => `<li>${h(x)}</li>`).join("")}</ul>` : ""}
    <footer class="doc-foot">${PRODUCT} · ${X.approved ? `Approved by ${h(X.approved.by)} on ${fmtDate(X.approved.at)}` : "AI-assisted draft, not yet approved"}</footer>
  </article>`;
}

// The chart that supports the first finding: T1 for the curated study, otherwise the first finding's question.
function figureData(c, d) {
  if (!d.figure) return null;
  const x = insightPack(c.id);
  if (d.figure.table) {
    const an = analyze(x.st.rows, x.st.ints, x.st.cases), T = an.tables[d.figure.table];
    return { title: `${T.id} · ${T.title}`, series: T.cols.slice(1).map(cc => cc.label), rows: T.rows.map(r => ({ label: r.label, values: r.cells.map(cc => cc.pct) })), cite: T.id };
  }
  const q = x.qn.questions.find(qq => qq.id === d.figure.qid);
  if (!q) return null;
  const t = tabQuestion(x.qn, q, x.rows, x.ans, d.figure.kind), multi = t.cols.length > 1;
  return { title: `${q.id} · ${shortQ(q.text)}`, series: multi ? t.cols.slice(1).map(cc => cc.label) : ["Total"], rows: t.rows.filter(r => !r.summary && !TAIL.test(r.label)).slice(0, 6).map(r => ({ label: r.label, values: multi ? r.cells.map(cc => cc.pct) : [r.total] })), cite: q.id };
}
const FIG_COLORS = ["var(--o1)", "var(--o2)", "var(--o3)", "var(--teal)"];
function docFigure(c, d) {
  const f = figureData(c, d);
  if (!f) return "";
  const k = f.series.length, W = 520, padL = 150, padR = 44, bh = 11, gap = 2, groupH = k * (bh + gap) + 12, top = 6, H = top + f.rows.length * groupH + 20;
  const x = v => padL + (W - padL - padR) * v;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${h(f.title)}">`;
  for (let t = 0; t <= 1.0001; t += 0.25) s += `<line class="gridline" x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H - 18}"/><text x="${x(t)}" y="${H - 4}" text-anchor="middle">${Math.round(t * 100)}%</text>`;
  f.rows.forEach((r, i) => {
    const y0 = top + i * groupH + 4;
    s += `<text x="${padL - 8}" y="${y0 + k * (bh + gap) / 2 + 3}" text-anchor="end">${h(r.label.length > 24 ? r.label.slice(0, 23) + "…" : r.label)}</text>`;
    r.values.forEach((v, j) => {
      const y = y0 + j * (bh + gap), w = Math.max(2, x(v) - padL);
      s += `<rect x="${padL}" y="${y}" width="${w.toFixed(1)}" height="${bh}" rx="3" fill="${k === 1 ? "var(--s1)" : FIG_COLORS[j]}" data-tip="${h(r.label)}${k > 1 ? " · " + h(f.series[j]) : ""}: ${pct(v)}"/><text class="val" x="${(x(v) + 4).toFixed(1)}" y="${y + bh - 2}" style="font-size:10px">${pct(v)}</text>`;
    });
  });
  return `<figure class="doc-fig"><figcaption>${h(f.title)}</figcaption>${s}</svg>${k > 1 ? `<div class="legend">${f.series.map((n, j) => `<span><i style="background:${FIG_COLORS[j]}"></i>${h(n)}</span>`).join("")}</div>` : ""}</figure>`;
}

const SUGGESTIONS = ["Make it shorter", "Add next steps", "Rewrite the headline for the CMO", "Remove finding 2"];
function chatHTML(c, X, busy) {
  return `<aside class="card chat" aria-label="AI editor">
    <div class="card-head" style="margin-bottom:8px"><h2>AI editor ${info("Ask for changes in plain words. Each change is saved as a new version, and every number stays tied to the tables.")}</h2><span class="src ${live() ? "live" : "replay"}">${live() ? "Live" : "Replay"}</span></div>
    <div class="chat-log" id="chat-log" aria-live="polite">${X.chat.map(m => `<div class="msg ${m.who}">${h(m.text)}</div>`).join("")}${S.busy.xchat ? '<div class="msg ai typing"><span class="spin"></span>Editing…</div>' : ""}</div>
    <div class="chat-sugg">${SUGGESTIONS.map(s => `<button class="filter" data-act="xsuggest" data-text="${h(s)}"${busy ? " disabled" : ""}>${h(s)}</button>`).join("")}</div>
    <form id="f-chat" class="chat-form"><textarea id="chat-in" rows="2" placeholder="Ask for a change…" aria-label="Ask the AI editor for a change"${busy ? " disabled" : ""}></textarea><button class="btn primary" type="submit" aria-label="Send"${busy ? " disabled" : ""}>${icon("send")}</button></form>
    <div class="versions"><span class="small muted">Versions</span>${X.versions.map((v, i) => `<button class="vchip" data-act="xver" data-i="${i}" aria-pressed="${i === X.cur}" data-tip="${h(v.label)}">v${i + 1}</button>`).join("")}${X.cur > 0 ? `<button class="link small" data-act="xver" data-i="${X.cur - 1}">Undo</button>` : ""}</div>
  </aside>`;
}

function execCite(cid, t) {
  S.rcid = cid;
  if (!/^T\d$/.test(t)) { const q = pool(cid).qn.questions.find(x => x.id === t); if (q) S.rBlocks[cid] = q.block; }
  go("report");
  setTimeout(() => cite(/^T\d$/.test(t) ? "tbl-" + t : "qc-" + t), 60);
}

// ---------- PDF export ----------

let jspdfLoad = null;
function loadJsPDF() {
  if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
  return jspdfLoad = jspdfLoad || new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload = () => window.jspdf ? res(window.jspdf.jsPDF) : rej(new Error("jsPDF missing"));
    s.onerror = () => { jspdfLoad = null; rej(new Error("load failed")); };
    document.head.appendChild(s);
  });
}
async function exportPDF(cid) {
  const X = execState(cid);
  if (!X) return;
  let JsPDF;
  try { JsPDF = await loadJsPDF(); } catch (e) { toast("The PDF tool couldn't load. Check the connection and try again."); return; }
  const c = camp(cid), cl = clientOf(c), d = curDoc(X), fig = figureData(c, d);
  const pdf = new JsPDF({ unit: "pt", format: "a4" });
  const W = 595.28, H = 841.89, M = 50, CW = W - 2 * M;
  const NAVY = [2, 35, 74], ACC = [96, 60, 252], MUTED = [107, 115, 133], TEXT = [29, 38, 57], LINE = [229, 232, 238], SER = [[160, 139, 253], [96, 60, 252], [46, 26, 153], [48, 180, 180]];
  const clean = s => String(s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, "-").replace(/…/g, "...").replace(/[▲]/g, "+").replace(/[^\x00-\xFF]/g, "");
  let y = M;
  const room = need => { if (y + need > H - 54) { pdf.addPage(); y = M; } };
  const text = (s, size, color, style = "normal", after = 4, indent = 0) => {
    pdf.setFont("helvetica", style); pdf.setFontSize(size); pdf.setTextColor(...color);
    pdf.splitTextToSize(clean(s), CW - indent).forEach(l => { room(size * 1.4); pdf.text(l, M + indent, y + size); y += size * 1.4; });
    y += after;
  };
  const heading = s => { room(40); y += 4; text(s.toUpperCase(), 9, ACC, "bold", 5); };
  pdf.setFillColor(...NAVY); pdf.rect(0, 0, W, 8, "F");
  text(`${PRODUCT} · Executive summary`, 8, MUTED, "bold", 8);
  text(c.name, 22, NAVY, "bold", 2);
  text(`${cl.brand} · ${c.id} · ${d.method}`, 9, MUTED, "normal", 14);
  pdf.setFillColor(240, 236, 255);
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(14);
  const hl = pdf.splitTextToSize(clean(d.headline), CW - 28);
  const hlH = hl.length * 14 * 1.35 + 22;
  room(hlH); pdf.roundedRect(M, y, CW, hlH, 6, 6, "F"); pdf.setTextColor(...NAVY);
  hl.forEach((l, i) => pdf.text(l, M + 14, y + 11 + 14 + i * 14 * 1.35));
  y += hlH + 14;
  if (d.kpis && d.kpis.length) {
    const k = d.kpis.length, bw = (CW - (k - 1) * 10) / k;
    room(64);
    d.kpis.forEach((kp, i) => {
      const x0 = M + i * (bw + 10);
      pdf.setDrawColor(...LINE); pdf.roundedRect(x0, y, bw, 58, 5, 5, "S");
      pdf.setFont("helvetica", "bold"); pdf.setFontSize(18); pdf.setTextColor(...NAVY); pdf.text(clean(kp.value), x0 + 10, y + 24);
      pdf.setFont("helvetica", "normal"); pdf.setFontSize(8.5); pdf.setTextColor(...TEXT); pdf.text(pdf.splitTextToSize(clean(kp.label), bw - 20)[0], x0 + 10, y + 38);
      if (kp.note) { pdf.setTextColor(...MUTED); pdf.text(pdf.splitTextToSize(clean(kp.note), bw - 20)[0], x0 + 10, y + 49); }
    });
    y += 68;
  }
  heading("Key findings");
  d.findings.forEach((f, i) => {
    room(44);
    pdf.setFillColor(...ACC); pdf.circle(M + 7, y + 7, 7, "F");
    pdf.setFont("helvetica", "bold"); pdf.setFontSize(8); pdf.setTextColor(255, 255, 255); pdf.text(String(i + 1), M + 7, y + 10, { align: "center" });
    text(f.title + (f.cite.length ? `  [${f.cite.join(", ")}]` : ""), 11, NAVY, "bold", 1, 22);
    text(f.body, 10, TEXT, "normal", 6, 22);
  });
  if (fig) {
    const k = fig.series.length, bh = 7, gh = k * (bh + 2) + 8, padL = 150, barW = CW - padL - 40;
    heading("Supporting data");
    text(fig.title, 9, TEXT, "bold", 4);
    room(fig.rows.length * gh + 30);
    fig.rows.forEach((r, i) => {
      const y0 = y + i * gh;
      pdf.setFont("helvetica", "normal"); pdf.setFontSize(8.5); pdf.setTextColor(...TEXT);
      pdf.text(pdf.splitTextToSize(clean(r.label), padL - 12)[0], M + padL - 8, y0 + (k * (bh + 2)) / 2 + 3, { align: "right" });
      r.values.forEach((v, j) => {
        const yy = y0 + j * (bh + 2);
        pdf.setFillColor(...(k === 1 ? ACC : SER[j])); pdf.roundedRect(M + padL, yy, Math.max(1.5, barW * v), bh, 2, 2, "F");
        pdf.setFontSize(7.5); pdf.setTextColor(...MUTED); pdf.text(pct(v), M + padL + Math.max(1.5, barW * v) + 4, yy + bh - 1);
      });
    });
    y += fig.rows.length * gh + 4;
    if (k > 1) { let lx = M + padL; fig.series.forEach((sname, j) => { pdf.setFillColor(...SER[j]); pdf.rect(lx, y, 8, 8, "F"); pdf.setFontSize(8); pdf.setTextColor(...MUTED); pdf.text(clean(sname), lx + 12, y + 7); lx += pdf.getTextWidth(clean(sname)) + 30; }); y += 18; }
  }
  const bullets = (items, size, color) => items.forEach(s => { room(size * 1.4); pdf.setFillColor(...color); pdf.circle(M + 4, y + size * 0.62, 1.6, "F"); text(s, size, color, "normal", 3, 14); });
  if (d.implications.length) { heading("Implications"); bullets(d.implications, 10, TEXT); }
  if (d.caveats.length) { heading("Method and caveats"); bullets(d.caveats, 9, MUTED); }
  const pages = pdf.getNumberOfPages(), stamp = X.approved ? `Approved by ${X.approved.by} on ${fmtDate(X.approved.at)}` : "DRAFT · not yet approved";
  for (let i = 1; i <= pages; i++) {
    pdf.setPage(i); pdf.setDrawColor(...LINE); pdf.line(M, H - 40, W - M, H - 40);
    pdf.setFont("helvetica", "normal"); pdf.setFontSize(8); pdf.setTextColor(...MUTED);
    pdf.text(clean(`${c.id} · v${X.cur + 1} · ${stamp}`), M, H - 26); pdf.text(`${i} / ${pages}`, W - M, H - 26, { align: "right" });
  }
  const name = `${c.id}-executive-summary-v${X.cur + 1}.pdf`, blob = pdf.output("blob");
  if (S.downloads) download(name, blob);
  else { pdf.save(name); toast(`Saved ${name}`); }
}
