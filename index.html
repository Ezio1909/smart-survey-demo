const BRAND_FUNNEL = { aware: [0.62, 0.78, 0.45, 0.52], consider: [0.55, 0.62, 0.48, 0.45], bought: [0.40, 0.50, 0.36, 0.32] };

// opts: interviewers [[id, city, quota]], bad {id, mode: "fake" | "rush"}, loi [mean, sd, min, max, speederMean], synced (share of quota done),
// funnel {aware, consider, bought} per brand.
function genField(seed = 2611, opts = {}) {
  const rng = mulberry32(seed);
  const F = opts.funnel || BRAND_FUNNEL;
  const rows = [];
  let id = 1;
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const bad = opts.bad || { id: FABRICATOR, mode: "fake" };
  const L = opts.loi || [17.6, 2.9, 11.5, 30];
  const synced = opts.synced ?? 1;
  for (const [int, city, quota] of opts.interviewers || INTERVIEWERS) {
    const fake = int === bad.id && bad.mode === "fake";
    const rush = int === bad.id && bad.mode === "rush";
    const [clat, clng] = CITY_CENTER[city];
    const base = [clat + (rng() - 0.5) * 0.03, clng + (rng() - 0.5) * 0.03];
    const cafe = [base[0] + 0.004, base[1] - 0.003];
    let day = 1, clock = 8.5 * 60 + rng() * 30;
    for (let i = 0; i < Math.round(quota * synced); i++) {
      const loi = fake ? clamp(normal(rng, 7.2, 1.0), 5.5, 9.5) : rush ? clamp(normal(rng, L[0] * 0.42, L[0] * 0.08), L[0] * 0.25, L[0] * 0.6)
        : (rng() < 0.015 ? clamp(normal(rng, L[4] ?? 7.6, 1.0), 5.5, 9.2) : clamp(normal(rng, L[0], L[1]), L[2], L[3]));
      const gap = fake ? 2 + rng() * 3 : 15 + rng() * 45;
      if (clock + loi > 19.5 * 60) { day++; clock = 8.5 * 60 + rng() * 40; }
      const start = clock; clock += loi + gap;
      const lat = fake ? cafe[0] + (rng() - 0.5) * 0.0004 : base[0] + (rng() - 0.5) * 0.07;
      const lng = fake ? cafe[1] + (rng() - 0.5) * 0.0004 : base[1] + (rng() - 0.5) * 0.07;
      const age = 1 + pickWeighted(rng, [35, 40, 25]);
      const gender = rng() < 0.5 ? 1 : 2;
      const pT = [0.80, 0.62, 0.40][age - 1], pS = [0.80, 0.86, 0.78][age - 1], pL = [0.20, 0.30, 0.38][age - 1];
      let plats = [];
      if (rng() < pT) plats.push(1);
      if (rng() < pS) plats.push(2);
      if (rng() < pL) plats.push(3);
      if (!plats.length) plats = [2];
      const w = plats.map(p => p === 1 ? [1.6, 1.0, 0.6][age - 1] : p === 2 ? 1.4 : 0.8);
      const main = plats[pickWeighted(rng, w)];
      const disc = 1 + pickWeighted(rng, DISC_W[main]);
      let oe, codes;
      if (fake || (rush && rng() < 0.6)) { const f = FAKE_OE[Math.floor(rng() * FAKE_OE.length)]; oe = f[0]; codes = f[1]; }
      else {
        const c1 = pickWeighted(rng, OE_W[main]);
        codes = ["C" + (c1 + 1)];
        let txt = OE_TEXT[codes[0]][Math.floor(rng() * OE_TEXT[codes[0]].length)];
        if (rng() < 0.28) {
          const wts = OE_W[main].map((x, j) => j === c1 ? 0 : x);
          const c2 = "C" + (pickWeighted(rng, wts) + 1);
          codes.push(c2);
          txt += " and " + OE_TEXT[c2][Math.floor(rng() * OE_TEXT[c2].length)];
        }
        const pre = ["", "", "Mainly because ", "Honestly, ", "For me, ", "Because "][Math.floor(rng() * 6)];
        const post = ["", "", ", especially for skincare", ", so I keep going back", ", that's the main thing"][Math.floor(rng() * 5)];
        oe = cap(pre + txt + post) + ".";
      }
      const aware = [], consider = [], bought = [];
      for (let b = 0; b < 4; b++) {
        const boost = b === 0 && age === 1 ? 0.08 : 0;
        if (rng() < F.aware[b] + boost) { aware.push(b + 1); if (rng() < F.consider[b]) { consider.push(b + 1); if (rng() < F.bought[b]) bought.push(b + 1); } }
      }
      let grid = null;
      if (aware.includes(1)) {
        const flat = rng() < (fake ? 0.7 : rush ? 0.45 : 0.04);
        const v0 = 2 + Math.floor(rng() * 3);
        grid = Array.from({ length: 6 }, () => flat ? v0 : clamp(Math.round(normal(rng, 3.5, 0.9)), 1, 5));
      }
      const npsMean = { 1: 7.6, 2: 7.9, 3: 7.2 }[main];
      rows.push({ id: id++, int, city, day, start, loi, lat, lng, age, gender, plats, main, disc, oe, codes, aware, consider, bought, grid,
        nps: clamp(Math.round(normal(rng, npsMean, 1.8)), 0, 10) });
    }
  }
  return rows;
}

function distM(a, b) {
  const dy = (a[0] - b[0]) * 111320, dx = (a[1] - b[1]) * 111320 * Math.cos(a[0] * Math.PI / 180);
  return Math.sqrt(dx * dx + dy * dy);
}

function qcField(rows) {
  const medAll = median(rows.map(r => r.loi));
  const speedCut = medAll * 0.5;
  const team = [];
  rows.forEach(r => { if (!team.some(t => t[0] === r.int)) team.push([r.int, r.city]); });
  const ints = team.map(([int, city]) => {
    const rs = rows.filter(r => r.int === int);
    const c = [rs.reduce((a, r) => a + r.lat, 0) / rs.length, rs.reduce((a, r) => a + r.lng, 0) / rs.length];
    const spread = median(rs.map(r => distM([r.lat, r.lng], c)));
    const speed = rs.filter(r => r.loi < speedCut).length / rs.length;
    const withGrid = rs.filter(r => r.grid);
    const flat = withGrid.filter(r => r.grid.every(v => v === r.grid[0])).length / Math.max(1, withGrid.length);
    const counts = {};
    const short = rs.filter(r => r.oe.split(/\s+/).length <= 3);
    short.forEach(r => { const k = r.oe.toLowerCase(); counts[k] = (counts[k] || 0) + 1; });
    const dup = short.filter(r => counts[r.oe.toLowerCase()] > 1).length / rs.length;
    const gaps = [];
    rs.forEach((r, i) => { const p = rs[i - 1]; if (p && p.day === r.day) gaps.push(r.start - (p.start + p.loi)); });
    const gap = median(gaps);
    const flags = [];
    if (rs.length < 8) return { int, city, n: rs.length, medLoi: median(rs.map(r => r.loi)), speed, flat, dup, spread, gap, flags, risk: "ok", centroid: c };
    if (speed > 0.2) flags.push({ sev: "critical", label: `${Math.round(speed * 100)}% speeders` });
    if (spread < 200) flags.push({ sev: "critical", label: `All interviews within ${Math.max(5, Math.round(spread * 2))} m` });
    if (dup > 0.3) flags.push({ sev: "serious", label: `${Math.round(dup * 100)}% short, repeated open-ends` });
    if (flat > 0.2) flags.push({ sev: "serious", label: `${Math.round(flat * 100)}% straight-lined grids` });
    if (gaps.length >= 3 && gap < 8) flags.push({ sev: "serious", label: `${gap.toFixed(1)} min between interviews` });
    const risk = flags.some(f => f.sev === "critical") ? "critical" : flags.length ? "serious" : "ok";
    return { int, city, n: rs.length, medLoi: median(rs.map(r => r.loi)), speed, flat, dup, spread, gap, flags, risk, centroid: c };
  });
  const caseFlags = {};
  rows.forEach(r => {
    const f = [];
    if (r.loi < speedCut) f.push("speeder");
    if (r.grid && r.grid.every(v => v === r.grid[0])) f.push("straight-liner");
    if (f.length) caseFlags[r.id] = f;
  });
  return { medAll, speedCut, ints, caseFlags };
}

// ---------- Tabulation ----------

function sigLetters(cols, rowFn) {
  // cols: [{key, letter, rows}], rowFn(r) -> boolean. Column-proportion z-test at 95%.
  const stats = cols.map(c => { const n = c.rows.length; const x = c.rows.filter(rowFn).length; return { n, p: n ? x / n : 0 }; });
  return stats.map((s, i) => {
    let letters = "";
    stats.forEach((o, j) => {
      if (i === j || s.n < 30 || o.n < 30) return;
      const p = (s.p * s.n + o.p * o.n) / (s.n + o.n);
      const se = Math.sqrt(p * (1 - p) * (1 / s.n + 1 / o.n));
      if (se > 0 && (s.p - o.p) / se > 1.96) letters += cols[j].letter;
    });
    return { pct: s.p, letters, n: s.n };
  });
}

function crosstab(id, title, base, colDefs, rowDefs, note) {
  const cols = colDefs.map(c => ({ label: c.label, letter: c.letter, rows: base.filter(c.fn) }));
  const total = { label: "Total", letter: "", rows: base };
  const rows = rowDefs.map(r => ({ label: r.label, total: base.filter(r.fn).length / Math.max(1, base.length), cells: sigLetters(cols, r.fn) }));
  return { id, title, note, cols: [total, ...cols].map(c => ({ label: c.label, letter: c.letter, n: c.rows.length })), rows };
}

function analyze(rows, excludedInts, excludedCases) {
  const base = rows.filter(r => !excludedInts.includes(r.int) && !excludedCases.includes(r.id));
  const ageCols = [{ label: "18-24", letter: "A", fn: r => r.age === 1 }, { label: "25-34", letter: "B", fn: r => r.age === 2 }, { label: "35-45", letter: "C", fn: r => r.age === 3 }];
  const platCols = PLATFORMS.map((p, i) => ({ label: p + " main", letter: "DEF"[i], fn: r => r.main === i + 1 }));
  const T1 = crosstab("T1", "Platforms used to buy skincare, past 3 months", base, ageCols,
    PLATFORMS.map((p, i) => ({ label: p, fn: r => r.plats.includes(i + 1) })), "Multiple answers. Column %.");
  const T2 = crosstab("T2", "Where the last skincare purchase was first discovered", base, platCols,
    DISCOVERY.map((d, i) => ({ label: d, fn: r => r.disc === i + 1 })), "By main platform. Column %.");
  const T3 = crosstab("T3", "Why respondents prefer their main platform (coded open-ends)", base, platCols,
    CODEFRAME.filter(c => c.code !== "C99").map(c => ({ label: c.label, fn: r => r.codes.includes(c.code) })), "Multiple codes per answer. Column %.");
  const T4 = { id: "T4", title: "Brand funnel", note: "% of all respondents. Conversion = bought / aware.",
    brands: BRANDS.slice(0, 4).map((b, i) => {
      const a = base.filter(r => r.aware.includes(i + 1)).length, c = base.filter(r => r.consider.includes(i + 1)).length, p = base.filter(r => r.bought.includes(i + 1)).length;
      return { brand: b, aware: a / base.length, consider: c / base.length, bought: p / base.length, conv: a ? p / a : 0 };
    }) };
  return { base, n: base.length, tables: { T1, T2, T3, T4 } };
}

// Recorded AI coding: matches the researcher codes except for a few low-confidence misses.
function replayCoding(base) {
  const rng = mulberry32(77);
  return base.map(r => {
    const miss = rng() < 0.06;
    const alt = CODEFRAME[Math.floor(rng() * 8)].code;
    const codes = miss ? [alt === r.codes[0] ? "C7" : alt] : r.codes.slice();
    return { id: r.id, codes, conf: miss ? 0.52 + rng() * 0.18 : 0.8 + rng() * 0.19 };
  });
}
function codingAgreement(coded, base) {
  const gold = Object.fromEntries(base.map(r => [r.id, r.codes]));
  const scored = coded.filter(c => gold[c.id]);
  const exact = scored.filter(c => c.codes.length === gold[c.id].length && c.codes.every(x => gold[c.id].includes(x))).length;
  const anyMatch = scored.filter(c => c.codes.some(x => gold[c.id].includes(x))).length;
  return { n: scored.length, exact: exact / Math.max(1, scored.length), any: anyMatch / Math.max(1, scored.length) };
}

// ---------- Responses ----------
// Answers for every interview, following the questionnaire's routing. Questions that measure something the
// field record already holds (age, city, platforms, brands, the platform open-end) take it from there, so the
// tables agree with Field QC. Every other question draws from a profile seeded by its bank ID, with age and
// city effects, so a bank question behaves alike in every campaign that reuses it.

function hashStr(str) { let x = 2166136261; for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }
const CITY_ORDER = ["HCMC", "Hanoi", "Da Nang", "Can Tho"];
const TAIL = /^(none( of these)?|other|prefer not to say|don'?t know|someone else)$/i;
const GRID_ITEMS = { "BRD-06": ["Effective", "Good value for money", "Natural ingredients", "Trustworthy", "Modern", "For someone like me"] };
const OE_POOL = {
  "SAT-02": [["I waited too long", "Only one counter was open", "Staff couldn't answer my question", "I had to come back for the same thing"],
    ["It was fine, nothing special", "Helpful staff but a slow queue", "Okay, but the branch was crowded"],
    ["Staff were friendly and quick", "Everything was done in one visit", "Short wait and clear advice", "The app and the branch work well together"]],
  ad: ["The family having breakfast together", "Fresh milk from the farm", "Something about less sugar", "The catchy song", "I don't remember much"],
  generic: ["Faster delivery", "Fewer fake products", "Clearer prices", "Easier returns", "More honest reviews", "Better customer service", "Nothing, it's fine", "More promotions"],
};

function gridItems(qn, q) {
  if (q.pipe) { const src = qn.questions.find(x => x.id === q.pipe); return src ? src.options : []; }
  const m = /\bon:\s*(.+?)[.?]?\s*$/i.exec(q.text || "");
  if (m) return m[1].split(/,\s*(?:and\s+)?|\s+and\s+/).filter(Boolean).map(x => x.charAt(0).toUpperCase() + x.slice(1));
  return GRID_ITEMS[q.bankId] || [1, 2, 3, 4, 5, 6].map(i => "Statement " + i);
}

function profileOf(key, n) {
  const rng = mulberry32(hashStr(key));
  const p = { base: [], age: [], city: [], mean: 3.3 + rng() * 0.8, ageMean: (rng() - 0.5) * 0.6, npsMean: 6.6 + rng() * 1.6 };
  for (let i = 0; i < n; i++) { p.base.push(0.25 + Math.pow(rng(), 1.5) * 2); p.age.push((rng() - 0.5) * 0.8); p.city.push((rng() - 0.5) * 0.6); }
  return p;
}

// The field record's own value for this question, or undefined to draw one.
function bindAnswer(qn, q, r, opts, firstGrid) {
  const n = opts.length;
  if (q.bind === "disc") return r.disc;
  if (q.type === "GRID" && !q.pipe && q.id === firstGrid) return r.grid ? r.grid.slice(0, gridItems(qn, q).length) : undefined;
  switch (q.bankId) {
    case "SCR-01": return r.age + 1;
    case "SCR-02": return r.gender;
    case "SCR-03": { const i = opts.indexOf(r.city); return i >= 0 ? i + 1 : undefined; }
    case "SCR-04": return [n];
    case "ECO-01": return r.plats.slice();
    case "ECO-02": return r.main;
    case "ECO-10": return r.oe;
    case "BRD-02": return r.aware.length ? r.aware.slice() : [n];
    case "BRD-03": return r.consider.length ? r.consider.slice() : [n];
    case "BRD-04": return r.bought.length ? r.bought.slice() : [n];
    case "BRD-05": return r.bought[0] || r.consider[0] || r.aware[0] || n;
    case "SAT-01": return clamp(r.nps + (hashStr(q.id) % 2), 0, 10) + 1;
  }
  return undefined;
}

function drawAnswer(rng, qn, q, A, opts, prof, r) {
  const n = opts.length, ageX = (r.age || 2) - 2, cityX = (CITY_ORDER.indexOf(r.city) - 1.5) / 1.5;
  const shift = i => Math.exp((prof.age[i] || 0) * ageX + (prof.city[i] || 0) * cityX);
  const tail = i => TAIL.test(String(opts[i]).trim());
  const rating = mean => clamp(Math.round(normal(rng, mean, 0.95)), 1, 5);
  if (q.type === "NUM") {
    if (q.bankId === "DEM-05") return clamp(Math.round(normal(rng, 3.8, 1.3)), 1, 9);
    const med = q.bankId === "ECO-04" ? 1500 : /skincare/i.test(q.text) ? 380 : 50;
    const step = med >= 300 ? 10 : 1;
    return Math.max(step, Math.round(Math.exp(normal(rng, Math.log(med) + 0.12 * ageX, 0.5)) / step) * step);
  }
  if (q.type === "GRID") {
    if (q.pipe) {
      const sel = [].concat(A[q.pipe] || []);
      return Object.fromEntries(sel.map(code => [code, n === 5 ? rating(prof.mean + (prof.age[code % n] || 0) * 0.4) : 1 + pickWeighted(rng, prof.base)]));
    }
    return gridItems(qn, q).map((_, k) => rating(prof.mean + (prof.age[k % Math.max(1, n)] || 0) * 0.4 * ageX));
  }
  if (q.pipe) {
    const sel = [].concat(A[q.pipe] || [1]);
    if (q.type === "MA") { const out = sel.filter(() => rng() < 0.55); return out.length ? out : [sel[0]]; }
    return sel[pickWeighted(rng, sel.map(c => prof.base[(c - 1) % Math.max(1, n)] || 1))];
  }
  if (q.type === "SCALE" && n === 11) return clamp(Math.round(normal(rng, prof.npsMean + prof.ageMean * ageX * 1.5, 1.9)), 0, 10) + 1;
  if (q.type === "SCALE") return clamp(Math.round(normal(rng, (prof.mean + prof.ageMean * ageX) * n / 5, 0.95)), 1, n);
  if (q.type === "MA") {
    const out = [];
    for (let i = 0; i < n; i++) if (!tail(i) && rng() < clamp((0.08 + prof.base[i] * 0.27) * shift(i), 0.03, 0.85)) out.push(i + 1);
    if (!out.length) { const t = opts.findIndex((o, i) => tail(i)); out.push(t >= 0 && rng() < 0.5 ? t + 1 : 1 + pickWeighted(rng, prof.base.map((b, i) => tail(i) ? 0 : b))); }
    return out;
  }
  return 1 + pickWeighted(rng, prof.base.map((b, i) => (tail(i) ? 0.12 : b) * shift(i)));
}

function oeAnswer(rng, qn, q, A, r) {
  const pick = arr => arr[Math.floor(rng() * arr.length)];
  if (q.bankId === "SAT-02") {
    const src = qn.questions.find(x => x.bankId === "SAT-01" && A[x.id] !== undefined);
    const score = src ? A[src.id] - 1 : 7;
    return pick(OE_POOL["SAT-02"][score <= 6 ? 0 : score <= 8 ? 1 : 2]);
  }
  if (q.bankId === "BRD-01") {
    const aided = qn.questions.find(x => x.bankId === "BRD-02");
    const names = aided ? optionsFor(qn, aided) : [];
    const said = r.aware.slice(0, 1 + Math.floor(rng() * 2)).map(i => names[i - 1]).filter(Boolean);
    return said.length ? said.join(", ") : "Can't think of any";
  }
  return pick(/\bad\b|advert/i.test(q.text) ? OE_POOL.ad : OE_POOL.generic);
}

// answers[rowId] = {questionId: answer}. seedKey keeps each campaign's draws distinct.
function genResponses(qn, rows, seedKey) {
  const profs = new Map();
  const prof = (q, n) => { const key = (q.bankId || seedKey + ":" + q.id) + ":" + n; if (!profs.has(key)) profs.set(key, profileOf(key, n)); return profs.get(key); };
  const firstGrid = (qn.questions.find(q => q.type === "GRID" && !q.pipe) || {}).id;
  const ctx = { fill: {} }, out = {};
  rows.forEach(r => {
    const rng = mulberry32(hashStr(seedKey + ":" + r.id));
    out[r.id] = walk(qn, (q, A, opts) => {
      const b = bindAnswer(qn, q, r, opts, firstGrid);
      if (b !== undefined) return b;
      if (q.type === "OE") return oeAnswer(rng, qn, q, A, r);
      const p = prof(q, Math.max(1, opts.length));
      let v = drawAnswer(rng, qn, q, A, opts, p, r);
      if (q.term) for (let i = 0; i < 40 && evalCond(q.term, Object.assign({}, A, { [q.id]: v })); i++) v = drawAnswer(rng, qn, q, A, opts, p, r);
      return v;
    }, ctx).A;
  });
  return out;
}

// ---------- Auto-tabulation ----------

// Age bands take their labels from the campaign's age question, since campaigns word the bands differently.
function bannerCols(kind, rows, qn) {
  if (kind === "age") {
    const q = qn && qn.questions.find(x => x.bankId === "SCR-01"), o = q ? optionsFor(qn, q) : [];
    return [1, 2, 3].map((a, i) => ({ label: o[a] || ["18-24", "25-34", "35-45"][i], letter: "ABC"[i], fn: r => r.age === a }));
  }
  if (kind === "gender") return [{ label: "Male", letter: "A", fn: r => r.gender === 1 }, { label: "Female", letter: "B", fn: r => r.gender === 2 }];
  if (kind === "city") return CITY_ORDER.filter(c => rows.some(r => r.city === c)).map((c, i) => ({ label: c, letter: "ABCD"[i], fn: r => r.city === c }));
  return [];
}
function tabRow(label, base, colDefs, fn) {
  const cols = colDefs.map(c => ({ letter: c.letter, rows: base.filter(c.fn) }));
  return { label, n: base.length, total: base.filter(fn).length / Math.max(1, base.length), cells: sigLetters(cols, fn) };
}

// One question as a table: rows by banner columns (kind: total, age, city, gender), with column-proportion tests.
function tabQuestion(qn, q, rows, ans, kind) {
  const has = r => ans[r.id] && ans[r.id][q.id] !== undefined && ans[r.id][q.id] !== null;
  const asked = rows.filter(has), v = r => ans[r.id][q.id];
  const colDefs = bannerCols(kind, rows, qn), opts = optionsFor(qn, q);
  const mean = (base, f) => base.length ? base.reduce((a, r) => a + f(r), 0) / base.length : null;
  const perCol = f => [f(asked), ...colDefs.map(c => f(asked.filter(c.fn)))];
  const t = { id: q.id, text: q.text, type: q.type, bankId: q.bankId || null, block: q.block, n: asked.length, kind: "pct", rows: [], note: "",
    cols: [{ label: "Total", letter: "", n: asked.length }, ...colDefs.map(c => ({ label: c.label, letter: c.letter, n: asked.filter(c.fn).length }))] };
  if (!asked.length) return t;
  if (q.type === "OE") {
    if (q.bankId === "ECO-10" && asked[0].codes) {
      t.rows = CODEFRAME.filter(c => c.code !== "C99").map(c => tabRow(c.short || c.label, asked, colDefs, r => r.codes.includes(c.code)));
      t.note = "Coded open-ends. Multiple codes per answer.";
      return t;
    }
    t.kind = "oe"; t.samples = [...new Set(asked.map(v).filter(x => x && String(x).length > 3))].slice(0, 4);
    return t;
  }
  if (q.type === "NUM") { t.kind = "num"; t.stats = { mean: perCol(b => mean(b, v)), median: perCol(b => b.length ? median(b.map(v)) : null) }; return t; }
  if (q.type === "GRID") {
    const asc = opts.length === 5;
    t.kind = "grid"; t.note = asc ? "Top 2 box (4 or 5) per item. Mean on a 1-5 scale." : `"${opts[0]}" per item.`;
    t.rows = gridItems(qn, q).map((label, k) => {
      const key = q.pipe ? k + 1 : k;
      const base = asked.filter(r => v(r)[key] !== undefined);
      return Object.assign(tabRow(label, base, colDefs, r => asc ? v(r)[key] >= 4 : v(r)[key] === 1), { mean: asc ? mean(base, r => v(r)[key]) : null });
    }).filter(r => r.n);
    return t;
  }
  if (q.type === "SCALE" && opts.length === 11) {
    const P = r => v(r) >= 10, D = r => v(r) <= 7;
    t.kind = "nps"; t.note = "Promoters 9-10, passives 7-8, detractors 0-6. NPS is promoters minus detractors.";
    t.rows = [tabRow("Promoters (9-10)", asked, colDefs, P), tabRow("Passives (7-8)", asked, colDefs, r => v(r) === 8 || v(r) === 9), tabRow("Detractors (0-6)", asked, colDefs, D)];
    t.stats = { nps: perCol(b => b.length ? Math.round(100 * (b.filter(P).length - b.filter(D).length) / b.length) : null) };
    return t;
  }
  const isMA = q.type === "MA";
  t.rows = opts.map((o, i) => tabRow(o, asked, colDefs, r => isMA ? [].concat(v(r)).includes(i + 1) : v(r) === i + 1));
  if (q.pipe) t.rows = t.rows.filter(r => r.total > 0);
  if (q.type === "SCALE") {
    t.kind = "scale"; t.note = `Mean on a 1-${opts.length} scale.`;
    t.rows.push(Object.assign(tabRow("Top 2 box", asked, colDefs, r => v(r) >= opts.length - 1), { summary: true }));
    t.stats = { mean: perCol(b => mean(b, v)) };
  } else t.note = isMA ? "Multiple answers. Column %." : "Column %.";
  return t;
}

// Headline numbers a campaign report leads with.
function keyMetrics(qn, rows, ans) {
  const out = [], one = id => { const qs = qn.questions.filter(q => q.bankId === id); return qs.length === 1 ? qs[0] : null; };
  const tq = q => tabQuestion(qn, q, rows, ans, "total");
  let q;
  if ((q = one("SAT-01"))) { const t = tq(q); if (t.n) out.push({ label: "NPS", value: t.stats.nps[0], fmt: "nps", qid: q.id, n: t.n }); }
  if ((q = one("SAT-03"))) { const t = tq(q); if (t.n) out.push({ label: "Satisfied", value: t.rows.find(r => r.summary).total, fmt: "pct", qid: q.id, n: t.n, note: "top 2 box" }); }
  if ((q = one("ECO-01"))) { const t = tq(q), top = [...t.rows].sort((a, b) => b.total - a.total)[0]; if (t.n) out.push({ label: `Buy on ${top.label}`, value: top.total, fmt: "pct", qid: q.id, n: t.n, note: "top platform" }); }
  if ((q = one("BRD-02"))) { const t = tq(q); if (t.n) out.push({ label: `Aware of ${optionsFor(qn, q)[0]}`, value: t.rows[0].total, fmt: "pct", qid: q.id, n: t.n, note: "aided" }); }
  if ((q = one("BRD-04"))) { const t = tq(q); if (t.n) out.push({ label: `Bought ${optionsFor(qn, q)[0]}`, value: t.rows[0].total, fmt: "pct", qid: q.id, n: t.n, note: "past 3 months" }); }
  return out;
}

// Bank questions a client can track from one campaign to the next.
const TRACK = {
  "BRD-02": { label: o => `Aware of ${o[0]}`, fn: v => [].concat(v).includes(1) },
  "BRD-03": { label: o => `Would consider ${o[0]}`, fn: v => [].concat(v).includes(1) },
  "BRD-04": { label: o => `Bought ${o[0]}, past 3 months`, fn: v => [].concat(v).includes(1) },
  "PRC-01": { label: () => "Use vouchers or promotions on most purchases", fn: v => v <= 2 },

  if (v["cl-code"] && !/^[A-Z]{2,3}$/.test(v["cl-code"])) e["cl-code"] = "Use 2-3 letters.";

function submitCampaign(form) {

  v.cities = fd.getAll("cities");
  const e = {};
  ["cp-client", "cp-name", "cp-target", "cp-n", "cp-budget", "cp-start", "cp-fstart", "cp-fend", "cp-end"].forEach(k => { if (!v[k]) e[k] = "Required."; });
  if (!v["cp-brief"] || v["cp-brief"] === BRIEF_TEMPLATE.trim()) e["cp-brief"] = "Write the brief: objective, key questions, method, target and quotas.";
  if (!v.cities.length) e.cities = "Pick at least one city.";
  if (v["cp-n"] && Number(v["cp-n"]) < 30) e["cp-n"] = "At least 30.";
  if (v["cp-start"] && v["cp-fstart"] && v["cp-fstart"] < v["cp-start"]) e["cp-fstart"] = "Must be on or after project start.";
  if (v["cp-fstart"] && v["cp-fend"] && v["cp-fend"] < v["cp-fstart"]) e["cp-fend"] = "Must be after fieldwork start.";
  if (v["cp-fend"] && v["cp-end"] && v["cp-end"] < v["cp-fend"]) e["cp-end"] = "Must be after fieldwork ends.";
  S.errors = e; S.forms.campaignDraft = v;
  if (Object.keys(e).length) { renderCampaigns(); const first = document.getElementById(Object.keys(e)[0]); if (first) first.focus(); return; }
  const client = S.clients.find(c => c.id === v["cp-client"]);

    budget: Number(v["cp-budget"]), spent: 0, status: "Draft", owner: v["cp-owner"], brief: v["cp-brief"], userAdded: true };
  S.campaigns.push(c); S.forms.campaign = false; S.forms.campaignDraft = null; S.errors = {};

function buildPrompt() {
  const c = camp(), cl = clientOf(c);
  const bank = KB.map(k => `${k.id} | ${k.module} | ${k.type} | ${k.text}${k.options.length ? " | options: " + k.options.map((o, i) => `${i + 1}=${o}`).join("; ") : ""} | topic: ${k.topic}`).join("\n");
  const channelRules = c.channels ? `- One block per platform with "scope" set to "tiktok", "shopee" or "lazada", asked only to users of that platform.
- The platforms-used question has id "A1" (bankId ECO-01), options 1=TikTok Shop, 2=Shopee, 3=Lazada, 4=Tiki, 5=Other. The main-platform question has id "A2" with "pipe":"A1".
- Put "pipe":"A1" on a GRID to repeat its rows for each platform the respondent uses.` : `- Give every block "scope":"all".`;
  return `You are a senior questionnaire designer at a market research agency. Draft a questionnaire (${c.method}) for the brief below.

BRIEF
${S.brief}

STUDY FACTS
Client: ${cl.brand} (${cl.industry}). Study type: ${c.type}. Target: ${c.target}. Sample: n=${c.n}. Cities: ${c.cities.join(", ")}. Interview length cap: ${c.loiCap} minutes.

QUESTION BANK (id | module | type | text | options | topic)
${bank}

RULES
- Reuse bank questions wherever they fit, aiming for about 70% of all questions. Reference a reused question by "bankId". Give "text" or "options" only if you adapt it to this client (for example its brand list).
- Write new questions only for needs the bank does not cover. Every new question needs "text", "type" (SA, MA, SCALE, NUM, OE or GRID), "options" (for SA, MA, SCALE and GRID), "topic" (short kebab-case), "sec" (expected seconds in the interview) and "why" (one line linking it to the brief).
- Structure: a screener whose "term" conditions end the interview for non-qualifying respondents, then the topic blocks, then demographics and closing.
${channelRules}
- Never ask the same thing twice. Keep wording neutral, one idea per question, under 25 words. Stay within the length cap.
- 20 to 60 questions. Question ids are the block letter plus a number (S1, A1, B1...).
${DSL}

Reply with only JSON in this shape:
{"blocks":[{"id":"S","name":"Screener","scope":"all"}],
 "questions":[{"id":"S1","block":"S","bankId":"SCR-01","term":{"q":"S1","in":[1,5]}},
  {"id":"B1","block":"B","text":"...","type":"SA","options":["..."],"topic":"...","sec":20,"ask":{"q":"S4","in":[1]},"why":"..."}]}`;
}

function normalizeDraft(raw) {
  if (!raw || !Array.isArray(raw.questions) || raw.questions.length < 10) throw { code: "bad_output", message: "The AI agent's draft was incomplete. Try again." };
  const scopes = ["all", "tiktok", "shopee", "lazada"];
  const blocks = (Array.isArray(raw.blocks) ? raw.blocks : []).filter(b => b && b.id).map(b => ({ id: String(b.id), name: String(b.name || b.id), scope: scopes.includes(b.scope) ? b.scope : "all" }));
  const seen = new Set(), questions = [];
  for (const q of raw.questions) {
    if (!q || !q.id || seen.has(String(q.id))) continue;
    if (q.bankId && !KB.some(k => k.id === q.bankId)) { if (!q.text) continue; delete q.bankId; }
    if (!q.bankId && !q.text) continue;
    seen.add(String(q.id));
    const out = { id: String(q.id), block: String(q.block || String(q.id)[0]) };
    ["bankId", "text", "type", "options", "topic", "sec", "ask", "term", "pipe", "why"].forEach(k => { if (q[k] !== undefined && q[k] !== null && q[k] !== "") out[k] = q[k]; });
    if (out.options && !Array.isArray(out.options)) delete out.options;
    if (out.sec !== undefined) out.sec = clampNum(out.sec, 4, 120, 15);
    if (out.ask && typeof out.ask !== "object") delete out.ask;
    if (out.term && typeof out.term !== "object") delete out.term;
    questions.push(out);
    if (!blocks.some(b => b.id === out.block)) blocks.push({ id: out.block, name: out.block, scope: "all" });
  }
  const settings = camp().channels ? {} : { platformSource: "none", mainSource: "none", scopeCodes: {} };
  return { version: 1, blocks, questions, settings, changelog: [{ version: 1, label: "Suggested by the AI agent from the brief", note: "", touched: [], removed: [], qids: [] }] };
}

async function actDraft() {
  const c = camp(), d = seedOf(c.id), recorded = !!d.questionnaire;
  const r = await runAI("build", {
    steps: recorded ? [`Matching the brief to ${KB.length} bank questions…`, "Drafting new questions…", "Writing routing…"] : [`Picking bank questions for a ${c.type.toLowerCase()} study…`, "Adapting brand lists…"],
    live: (p, signal) => askJSON(buildPrompt(), "default", p, signal, t => `Drafting… ${(t.match(/"id"\s*:/g) || []).length} questions`).then(normalizeDraft),
    replay: () => recorded ? clone(d.questionnaire) : templateDraft(c, clientOf(c).brand),
    done: () => recorded || live() ? "Draft ready" : "Template draft ready",
  });
  if (!r) return;
  if (S.qn) S.qnUndo = (S.qnUndo || []).concat([S.qn]).slice(-20);
  S.edit = null; S.armRedraft = false; S.bankPick = null;
  S.qn = hydrate(r.result);
  S.qnOrigin = r.src === "live" ? "live" : recorded ? "recorded" : "template";
  if (S.qnOrigin === "recorded") S.qn.changelog = [{ version: 1, label: "Drafted from the brief", note: draftNote(S.qn), touched: [], removed: [], qids: [] }];
  if (S.qnOrigin === "template") S.qn.changelog = [{ version: 1, label: "Template draft from the question bank", note: "Reused questions only. Use Live AI to write the questions specific to this brief.", touched: [], removed: [], qids: [] }];
  S.aiLint = S.qnOrigin === "recorded" ? (d.aiLint || []) : [];
  S.personas = S.qnOrigin === "recorded" ? S.personaLib.filter(p => p.recorded[c.id]).map(p => personaForRun(p, S.qn, c.id, true)) : [];
  S.fixes = S.qnOrigin === "recorded" ? (d.fixes || {}) : {};
  S.dismissed = new Set();
  if (c.status === "Draft") setCampaignStatus(c, "Building");
  recalcPretest(); rerender();
}

async function actLint() {
  const r = await runAI("lint", {
    steps: ["Reading new questions…", "Checking wording…"],
    live: (p, signal) => S.sample.json(`Review the new questions in this survey questionnaire. Flag only real problems: double-barreled, leading, ambiguous, jargon a respondent may not know, overlap with another question, or hard to answer. Ignore reused questions unless they overlap with a new one.

QUESTIONS (id | type | source | text | options)
${S.qn.questions.map(qLine).join("\n")}

Reply with only a JSON array, or [] if nothing is wrong:
[{"q":"T4","type":"double-barreled","severity":"medium","note":"one sentence on why it is a problem","suggestion":"better wording or action"}]`, { modelTier: "quick", signal, onText: () => p("Reviewing…") }),
    replay: () => S.qnOrigin === "recorded" ? (seedOf(S.cid).aiLint || []) : [],
    done: res => `${(res || []).length} flagged`,
  });
  if (!r) return;

  recalcPretest(); rerender();
}

function questionHTML(q, iss, l) {
  const opts = optionsFor(S.qn, q);
  let optText = "";
  if (q.type === "GRID" && q.pipe) optText = `One row per platform in ${q.pipe}${q.loop ? " (rotation)" : ""}. Scale: ${opts.join(" / ")}`;
  else if (q.pipe) optText = `Options piped from ${q.pipe}`;
  else if (opts.length) optText = opts.map((o, i) => `${i + 1}. ${o}`).join("\n");
  const tip = [optText, `About ${q.sec} s${q.type === "GRID" && q.pipe ? " per row" : ""}`, q.adapted ? "Reused from the bank and adapted to this client." : "", q.source === "new" && q.why ? "Why: " + q.why : "", iss ? `${SEV_LABEL[iss.sev]}: ${iss.title}` : l ? `${l.types.join(", ")}: ${l.note}` : ""].filter(Boolean).join("\n\n");
  const cls = iss ? (iss.sev === "critical" ? "flagged crit" : "flagged") : (l ? "flagged" : "");
  const flag = iss ? `<span class="sev ${iss.sev}">${h(iss.kind)}</span>` : l ? `<span class="sev ${l.severity}">${h(l.types[0])}</span>` : "";
  const acts = canEdit() ? `<div class="qact"><button class="ib" data-act="qedit" data-id="${h(q.id)}" aria-label="Edit ${h(q.id)}" data-tip="Edit">${icon("pencil")}</button><button class="ib" data-act="qmove" data-id="${h(q.id)}" data-dir="-1" aria-label="Move ${h(q.id)} up" data-tip="Move up">${icon("up")}</button><button class="ib" data-act="qmove" data-id="${h(q.id)}" data-dir="1" aria-label="Move ${h(q.id)} down" data-tip="Move down">${icon("down")}</button><button class="ib${S.armDel === q.id ? " danger" : ""}" data-act="qdel" data-id="${h(q.id)}" aria-label="Delete ${h(q.id)}" data-tip="${S.armDel === q.id ? "Click again to delete" : "Delete"}">${S.armDel === q.id ? "Delete?" : icon("trash")}</button></div>` : "";
  return `<div class="q ${cls}" id="q-${h(q.id)}">
    <span class="qid">${h(q.id)}</span><span class="qtext">${h(q.text)}</span>${info(tip)}${acts}
    <div class="qmeta"><span class="chip type">${h(q.type)}</span>${q.source === "reuse" ? `<span class="chip reuse">${h(q.bankId)}${q.adapted ? " · adapted" : ""}</span>` : '<span class="chip new">New</span>'}${q.edited ? '<span class="chip scope">Edited</span>' : ""}${q.fixed ? '<span class="chip fixed">Fixed</span>' : ""}${flag}
      ${q.ask ? `<span class="chip route">IF ${h(describeCond(S.qn, q.ask))}</span>` : ""}${q.term ? `<span class="chip route term">END IF ${h(describeCond(S.qn, q.term))}</span>` : ""}</div>
  </div>`;
}

function routingQuestions() {
  const ids = new Set([S.qn.settings.platformSource, S.qn.settings.mainSource]);
  S.qn.questions.forEach(q => { [q.ask, q.term].forEach(c => condLeaves(c).forEach(l => ids.add(l.q))); if (q.pipe) ids.add(q.pipe); });
  return S.qn.questions.filter(q => ids.has(q.id));
}
async function actPretest() {
  const c = camp();
  if (["Draft", "Building"].includes(c.status)) setCampaignStatus(c, "Pretest");
  const sel = (S.pSel || []).map(personaById).filter(Boolean);
  if (!sel.length) {
    S.personas = []; recalcPretest(); rerender();
    setStatus("pretest", { text: "Ran 2,000 test interviews. Pick personas to hear how people would read the questions.", src: live() ? "live" : "replay" });
    return;
  }
  let answered = 0;
  const r = await runAI("pretest", {
    steps: ["Running 2,000 test interviews…", `${sel.length} personas are answering…`],
    live: async (p, signal) => {
      p(`Personas answered: 0 of ${sel.length}`);
      const out = await Promise.all(sel.map(x => runPersonaLive(x, S.qn, signal)
        .catch(e => { if (e && (e.code === "cancelled" || HIDE_CODES.includes(e.code))) throw e; return null; })
        .then(res => { p(`Personas answered: ${++answered} of ${sel.length}`); return res; })));
      const ok = out.filter(Boolean);
      if (!ok.length) throw { code: "bad_output", message: "No persona could answer. Try again." };
      return ok;
    },
    replay: () => sel.map(x => personaForRun(x, S.qn, c.id, S.qnOrigin === "recorded")),
    done: res => { const rec = res.filter(x => x.recorded).length; return `2,000 test interviews · ${res.length} personas${!live() && rec < res.length ? ` · think-aloud notes are recorded for ${rec}; switch to Live AI to hear from the others` : ""}`; },
  });
  if (!r) return;
  S.personas = r.result;
  recalcPretest(); rerender();
}

function fixPrompt(issue) {
  const ids = new Set(issue.qids);
  const qs = S.qn.questions;
  if (issue.kind === "Length") qs.filter(q => blockOf(S.qn, q).scope !== "all" || (q.type === "GRID" && q.pipe)).forEach(q => ids.add(q.id));
  [...ids].forEach(id => { const q = qs.find(x => x.id === id); if (q) [q.ask, q.term].forEach(c => condLeaves(c).forEach(l => ids.add(l.q))); });
  const involved = qs.filter(q => ids.has(q.id)).map(q => ({ id: q.id, block: q.block, blockScope: blockOf(S.qn, q).scope, text: q.text, type: q.type, options: optionsFor(S.qn, q), ask: q.ask || undefined, term: q.term || undefined, pipe: q.pipe, topic: q.topic, sec: q.sec }));
  return `You are fixing one problem found while pretesting a survey questionnaire.

PROBLEM (${issue.kind}): ${issue.title}
${issue.detail}
${issue.evidence.length ? "PERSONA FEEDBACK\n" + issue.evidence.map(e => `${e.who}: ${e.text}`).join("\n") : ""}

QUESTIONS INVOLVED (JSON)
${JSON.stringify(involved)}

ALL QUESTIONS (id | type | source | text | options | condition)
${qs.map(qLine).join("\n")}

${DSL}

Make the smallest change that fixes the problem and keeps the questionnaire compact. Keep existing ids; give any new question a new id. Reply with only JSON, using only the keys you need:
{"note":"one sentence describing the change","patch":[{"id":"L1","set":{"ask":{"q":"A1","has":[3]}}}],"remove":["T2"],"add":[{"after":"B2","question":{"id":"B2a","block":"B","text":"...","type":"MA","options":["..."],"topic":"...","sec":15,"ask":{"q":"B2","in":[1]}}}]}`;
}
function normalizeFix(raw) {
  if (!raw || typeof raw !== "object") throw { code: "bad_output", message: "The AI agent's fix couldn't be read. Try again." };
  const fix = { note: String(raw.note || "Fixed with AI") };
  if (Array.isArray(raw.patch)) fix.patch = raw.patch.filter(p => p && p.id && p.set && typeof p.set === "object").map(p => {
    const set = {}; ["text", "type", "options", "ask", "term", "pipe", "topic", "sec"].forEach(k => { if (k in p.set) set[k] = p.set[k]; });
    return { id: String(p.id), set };
  });
  if (Array.isArray(raw.remove)) fix.remove = raw.remove.map(String);
  if (Array.isArray(raw.add)) fix.add = raw.add.filter(a => a && a.question && a.question.id && a.question.text).map(a => ({ after: String(a.after || ""), question: a.question }));
  if (!fix.patch && !fix.remove && !fix.add) throw { code: "bad_output", message: "The AI agent didn't propose a change. Try again." };
  return fix;
}
function canFix(issue) { return live() || (S.qnOrigin === "recorded" && !!S.fixes[issue.fixKey]); }

async function actFix(key) {
  const issue = S.issues.find(i => i.key === key);
  if (!issue) return false;
  const r = await runAI("fix:" + key, {
    steps: ["Writing the fix…"],
    live: (p, signal) => S.sample.json(fixPrompt(issue), { modelTier: "default", signal, onText: () => p("Writing the fix…") }).then(normalizeFix),
    replay: () => S.fixes[issue.fixKey],
    done: () => "Fixed",
  });
  if (!r) return false;
  S.qn = applyFix(S.qn, r.result, issue.title, issue.qids);
  recalcPretest(); rerender();
  toast(`v${S.qn.version} · ${r.result.note || "fix applied"}`);
  return true;
}
async function actFixAll() {
  if (S.busy.fixall) return;
  S.busy.fixall = { ctl: new AbortController() };
  let applied = 0;
  for (let pass = 0; pass < 3; pass++) {
    const todo = S.issues.filter(canFix).filter(i => !i.key.startsWith("fb:"));
    if (!todo.length) break;
    for (const i of todo) {
      if (!S.issues.some(x => x.key === i.key)) continue;
      setStatus("fixall", { text: `Fixing: ${i.title}`, src: live() ? "live" : "replay" });
      const ok = await actFix(i.key);
      if (!ok) { S.busy.fixall = null; return; }
      applied++;
    }
  }
  S.busy.fixall = null;
  setStatus("fixall", { text: `${applied} fix${applied === 1 ? "" : "es"} applied · now v${S.qn.version}` });
  rerender();
}
function actApprove() {
  const c = camp();
  if (S.issues.some(i => i.sev === "critical")) { toast("Fix the critical issues before approving for field."); return; }
  ensureBank(); // seed the bank from earlier campaigns first, so this approval's questions show as new
  setCampaignStatus(c, "In field");
  const added = onApproved(c, S.qn);
  toast(`${c.id} approved for field.${added ? ` ${added} new question${added === 1 ? "" : "s"} added to the Question Bank.` : ""} Field QC opens when interviews sync.`);
  go("field");
}

function renderPretest() {
  const c = camp();
  const tip = "2,000 random test interviews run every routing path. Then personas you pick from the library take the survey, each on its own model, and say what confused them.\n\nPersonas test the questionnaire, not the market. They never replace real respondents.";
  if (!S.qn) {
    const body = reached(c, "In field") ? emptyState("check", "Pretest signed off", `Fieldwork ${c.status === "Reported" ? "closed" : "is running"}. The final questionnaire is archived.`) : emptyState("flask", "Nothing to pretest yet", "Draft the questionnaire from the brief first.", `<button class="btn primary" data-act="view" data-view="build">Open Survey Builder</button>`);
    document.getElementById("v-pretest").innerHTML = `${ctxBar()}${pageHead("Pretest Lab", tip)}<section class="card">${body}</section>`;
    return;
  }
  const sim = S.sim, issues = S.issues;
  const never = S.qn.questions.filter(q => sim.reach[q.id] === 0).length;
  const worst = Object.entries(sim.loiByCount).sort((a, b) => b[1].mean - a[1].mean)[0];
  const crit = issues.filter(i => i.sev === "critical").length;
  const fixable = issues.filter(canFix).filter(i => !i.key.startsWith("fb:")).length;
  const canApprove = ["Draft", "Building", "Pretest"].includes(c.status);
  const approve = canApprove ? `<button class="btn" data-act="approve"${crit ? ' disabled title="Fix critical issues first"' : ""}>${icon("check")}Approve for field</button>` : "";
  const personasBody = S.personas.length ? `<div class="personas">${sim.personaRuns.map(personaHTML).join("")}</div>`
    : reached(c, "In field") ? emptyState("check", `Pretest signed off${seedOf(c.id).signedOff ? " on " + seedOf(c.id).signedOff : ""}`, "Personas from that run are archived.")
    : emptyState("flask", "No persona results yet", "Pick personas above, then run the pretest.");
  document.getElementById("v-pretest").innerHTML = `
  ${ctxBar()}
  ${pageHead("Pretest Lab", tip, `${approve}<button class="btn" data-act="fixall"${!fixable || S.busy.fixall ? " disabled" : ""}>${icon("wand")}Apply all fixes${fixable ? ` (${fixable})` : ""}</button><button class="btn primary" data-act="pretest"${S.busy.pretest ? " disabled" : ""}>${icon("play")}Run pretest</button>`)}
  ${statusHTML("pretest")}${statusHTML("fixall")}
  <div class="tiles">
    ${tile("Test interviews", sim.completes.toLocaleString(), "qualified completes", false, "Random answers that follow the routing, like the test-data generators in Forsta or Alchemer. Only qualifying paths are kept.")}
    ${tile("Never reached", never, never ? "dead routing" : "all reachable", never > 0)}
    ${tile("Open issues", issues.length, crit ? `${crit} critical` : issues.length ? "none critical" : "ready for field", crit > 0)}
    ${tile("Longest path", worst ? worst[1].mean.toFixed(1) + " min" : "n/a", `cap ${c.loiCap} min`, worst && worst[1].mean > c.loiCap)}
  </div>
  ${canApprove ? pickerHTML(c) : ""}
  <div class="grid-2r">
    <section class="card">${cardHead("Issues", `<span class="sub">v${S.qn.version}</span>`)}
      <div class="issues">${issues.length ? issues.map(issueHTML).join("") : emptyState("check", "No open issues", `Every path is reachable and within the ${c.loiCap}-minute cap.`, canApprove ? `<button class="btn primary" data-act="approve">Approve for field</button>` : `<button class="btn primary" data-act="view" data-view="field">Go to Field QC</button>`)}</div>
    </section>
    <div class="stack">
      <section class="card">${cardHead("Interview length", "", "Average length of the test interviews against the campaign's cap." + (c.channels ? " Split by how many of TikTok Shop, Shopee and Lazada the respondent uses." : ""))}${loiChart(sim.loiByCount, c.loiCap)}</section>
      <section class="card">${cardHead("Routing coverage", "", "Share of test interviews that reach each conditional question. Red outline: never reached.")}${coverageTable()}</section>
    </div>
  </div>
  <section class="card">${cardHead("Persona results", `<span class="sub">${S.personas.length ? `${S.personas.length} simulated respondents` : ""}</span>`, "Each persona answers in character on its own model and leaves think-aloud notes, which are attached to the issues above.")}${personasBody}</section>`;
}

function issueHTML(i) {
  const can = canFix(i), fb = i.key.startsWith("fb:");
  const btn = fb && !live() ? `<button class="btn sm" data-act="dismiss" data-key="${h(i.key)}">Dismiss</button>`
    : `<button class="btn sm${can ? " primary" : ""}" data-act="fix" data-key="${h(i.key)}"${!can || S.busy["fix:" + i.key] ? " disabled" : ""}${!can ? ' title="Switch to Live AI to fix this draft"' : ""}>${live() ? "Fix with AI" : "Fix"}</button>`;
  const faces = i.evidence.length ? `<div class="faces"><span class="stack-av">${i.evidence.slice(0, 4).map(e => `<span class="av ${avTint(e.who)}" tabindex="0" data-tip="${h(e.who)}: “${h(e.text)}”">${h(e.who[0])}</span>`).join("")}</span>${i.evidence.length} persona${i.evidence.length > 1 ? "s" : ""}</div>` : "";
  return `<article class="issue">
    <div class="issue-main"><div class="issue-top"><span class="sev ${i.sev}">${SEV_LABEL[i.sev]}</span><span class="kind">${h(i.kind)}${i.qids.length ? " · " + h(i.qids.slice(0, 3).join(", ")) : ""}</span></div>
      <h3>${h(i.title)}</h3>${faces}${statusHTML("fix:" + i.key)}</div>
    <div class="issue-side">${info(i.detail)}${btn}</div>
  </article>`;
}

function loiChart(loi, cap) {
  let rows = [1, 2, 3].filter(k => loi[k]).map(k => ({ label: `${k} platform${k > 1 ? "s" : ""}`, v: loi[k].mean, n: loi[k].n }));
  if (!rows.length) rows = Object.values(loi).map(v => ({ label: "All paths", v: v.mean, n: v.n }));
  const W = 400, padL = 80, padR = 70, top = 22, rowH = 34, H = top + rows.length * rowH + 22;
  const max = Math.ceil(Math.max(cap + 4, ...rows.map(r => r.v + 2)) / 5) * 5;
  const x = v => padL + (W - padL - padR) * v / max;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mean interview length">`;
  for (let t = 0; t <= max; t += 5) s += `<line class="gridline" x1="${x(t)}" x2="${x(t)}" y1="${top - 4}" y2="${H - 20}"/><text x="${x(t)}" y="${H - 6}" text-anchor="middle">${t}</text>`;
  rows.forEach((r, i) => {
    const y = top + i * rowH + 7, bh = 18, w = Math.max(2, x(r.v) - padL), rr = Math.min(4, w / 2);
    const over = r.v > cap;
    s += `<text x="${padL - 8}" y="${y + 13}" text-anchor="end">${r.label}</text>`;
    s += `<path d="M${padL} ${y} h${w - rr} a${rr} ${rr} 0 0 1 ${rr} ${rr} v${bh - 2 * rr} a${rr} ${rr} 0 0 1 -${rr} ${rr} h-${w - rr} z" fill="${over ? "var(--crit)" : "var(--s1)"}" data-tip="${r.label}: ${r.v.toFixed(1)} min (${r.n.toLocaleString()} interviews)"/>`;
    s += `<text class="val" x="${W - 2}" y="${y + 13}" text-anchor="end">${r.v.toFixed(1)} min${over ? " ▲" : ""}</text>`;
  });
  return s + `<line x1="${x(cap)}" x2="${x(cap)}" y1="${top - 10}" y2="${H - 20}" stroke="var(--crit)" stroke-width="1.5"/><text x="${x(cap)}" y="${top - 12}" text-anchor="middle">Cap ${cap}</text></svg>`;
}

function dependsOnPlatform(q, seen = new Set()) {
  if (!q || seen.has(q.id)) return false;
  seen.add(q.id);
  return condLeaves(q.ask).some(l => l.q === S.qn.settings.platformSource || dependsOnPlatform(S.qn.questions.find(x => x.id === l.q), seen));
}
function coverageTable() {
  const sim = S.sim;
  const order = ["1", "2", "3", "1+2", "1+3", "2+3", "1+2+3"].filter(k => sim.combos[k]);
  const cell = (v, tipTxt, dead) => { const p = Math.round(v * 100); return `<td class="cell${dead ? " dead" : ""}" style="background:color-mix(in oklab, var(--s1) ${Math.round(v * 80)}%, var(--panel));color:${p >= 55 ? "#fff" : "var(--text)"}" data-tip="${h(tipTxt)}: ${p}% reached">${p}</td>`; };
  if (!order.length) {
    const rows = S.qn.questions.filter(q => q.ask && q.block !== "S");
    if (!rows.length) return '<p class="small muted">No conditional questions.</p>';
    return `<div class="tbl-wrap"><table class="cov"><thead><tr><th>Q</th><th style="text-align:left">Asked when</th><th>Reach %</th></tr></thead><tbody>${rows.map(q => { const v = sim.reach[q.id] / Math.max(1, sim.completes); return `<tr><td class="mono small"><b>${h(q.id)}</b></td><td class="small" style="text-align:left">${h(describeCond(S.qn, q.ask))}</td>${cell(v, q.id, v === 0)}</tr>`; }).join("")}</tbody></table></div>`;
  }
  const short = { 1: "TT", 2: "SP", 3: "LZ" };
  const rows = S.qn.questions.filter(q => q.block !== "S" && (blockOf(S.qn, q).scope !== "all" || dependsOnPlatform(q)));
  const name = k => k.split("+").map(c => PLATFORMS[c - 1]).join(" + ");
  const head = order.map(k => `<th data-tip="${name(k)} · ${sim.combos[k].n} test interviews">${k === "1+2+3" ? "All" : k.split("+").map(c => short[c]).join("+")}</th>`).join("");
  const body = rows.map(q => {
    const vals = order.map(k => (sim.combos[k].reach[q.id] || 0) / sim.combos[k].n);
    const dead = vals.every(v => v === 0);
    return `<tr><td class="mono small"><b>${h(q.id)}</b></td>${vals.map((v, j) => cell(v, `${q.id} · ${name(order[j])}`, dead)).join("")}</tr>`;
  }).join("");
  return `<div class="tbl-wrap"><table class="cov"><thead><tr><th>Q</th>${head}</tr></thead><tbody>${body}</tbody></table></div><p class="chart-cap">TT TikTok Shop · SP Shopee · LZ Lazada</p>`;
}

function personaHTML(run) {
  const p = run.persona, src = S.qn.settings.platformSource;
  const plats = src && src !== "none" ? [].concat(p.answers[src] || []).map(c => PLATFORMS[c - 1]).filter(Boolean) : [];
  const path = S.qn.blocks.map(b => {
    const hit = S.qn.questions.some(q => q.block === b.id && run.reached.includes(q.id));
    return `<span class="${hit ? "" : "off"}" data-tip="${h(b.name)}${hit ? "" : " (not asked)"}">${h(b.id)}</span>`;
  }).join("");
  const notes = (p.notes || []).map(n => `${n.q}: “${n.comment}”`).join("\n\n");
  return `<div class="persona">
    <div class="persona-top"><span class="avatar ${avTint(p.name)}" aria-hidden="true">${h(p.name[0])}</span><div><div class="who">${h(p.name)}, ${h(p.age)}</div><div class="meta">${h([p.city, p.occupation].filter(Boolean).join(" · "))}</div></div>${info(p.bio)}</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap"><span class="chip scope">${h(modelOf(p.model || "balanced")[1])} model</span>${p.recorded === false && !live() ? '<span class="chip type" data-tip="Answers from the persona profile. Live AI adds think-aloud notes.">Profile answers</span>' : ""}</div>
    ${plats.length ? `<div style="display:flex;gap:4px;flex-wrap:wrap">${plats.map(x => `<span class="chip type">${h(x)}</span>`).join("")}</div>` : ""}
    <div class="path" aria-label="Blocks asked">${path}</div>
    <div class="persona-foot"><span>${run.loi.toFixed(1)} min · ${run.reached.length} Q</span>${notes ? `<button type="button" class="notes-chip" data-tip="${h(notes)}">${p.notes.length} note${p.notes.length > 1 ? "s" : ""}</button>` : ""}</div>
  </div>`;
}

// ---------- Stage 3: Field QC ----------

function notePrompt(i) {
  const team = S.qc.ints.filter(x => x.int !== i.int);
  const med = f => median(team.map(f));
  return `You are a fieldwork quality manager at a market research agency. Write a short note (under 120 words) to the ${i.city} field supervisor about interviewer ${i.int}, based on the checks below. ${i.risk === "ok" ? "The checks are within the team's normal range: say so briefly and recommend only the routine 10% phone back-check sample." : "State the evidence, the decision (interviews quarantined, excluded from analysis until back-checked) and the next steps (phone back-checks on a sample of respondents, GPS and photo audit, then retraining or removal)."} Neutral, factual tone. No greeting and no signature.

CHECKS FOR ${i.int} (${i.n} interviews)
Median interview length: ${i.medLoi.toFixed(1)} min
Speeders (under ${S.qc.speedCut.toFixed(1)} min): ${pct(i.speed)}
Straight-lined grids: ${pct(i.flat)}
Short, repeated open-ends: ${pct(i.dup)}
Median distance between interview locations and their centre: ${Math.round(i.spread)} m
Median gap between interviews: ${i.gap.toFixed(1)} min

TEAM MEDIANS (other ${team.length} interviewers)
Interview length ${med(x => x.medLoi).toFixed(1)} min; speeders ${pct(med(x => x.speed))}; straight-lined ${pct(med(x => x.flat))}; repeated open-ends ${pct(med(x => x.dup))}; location spread ${Math.round(med(x => x.spread))} m; gap ${med(x => x.gap).toFixed(0)} min.`;
}
function replayNote(i) {
  const teamLoi = median(S.qc.ints.map(x => x.medLoi));
  if (i.risk === "ok") return `No action needed for ${i.int}. All ${i.n} interviews are within the team's normal range: median length ${i.medLoi.toFixed(1)} min (team ${teamLoi.toFixed(1)} min), ${pct(i.speed)} speeders, ${pct(i.flat)} straight-lined grids, and locations spread across ${(i.spread / 1000).toFixed(1)} km of ${i.city}.

Keep ${i.int} in the routine 10% phone back-check sample.`;
  const clustered = i.spread < 200;
  return `${i.int}'s ${i.n} interviews are quarantined and excluded from analysis until back-checked.

Evidence: median length ${i.medLoi.toFixed(1)} min against a team median of about ${teamLoi.toFixed(0)} min; ${pct(i.speed)} under the speeder cut. ${clustered ? `All interviews logged within about ${Math.max(5, Math.round(i.spread * 2))} m of one point, typically ${i.gap.toFixed(0)} min apart. ` : `Locations look normal, so this reads as rushing rather than invented interviews. `}${pct(i.flat)} of grids straight-lined; ${pct(i.dup)} of open-ends are short repeats such as "good" and "ok".

Next steps: phone back-checks with 20% of respondents this week, ${clustered ? "GPS and photo audit of the last two field days" : "an accompanied shift with the supervisor"}, then a decision on retraining or removal.`;
}

async function actNote() {
  const i = S.qc.ints.find(x => x.int === S.selInt);
  const r = await runAI("note", {
    steps: ["Comparing with the team…", "Drafting the note…"],
    live: (p, signal) => S.sample(notePrompt(i), { modelTier: "quick", signal, onText: ({ text }) => { S.note = text; const el = document.getElementById("note-text"); if (el) el.textContent = text; p("Writing…"); } }).then(x => x.text),
    replay: () => replayNote(i),
    done: () => "Note drafted",
  });
  if (!r) return;
  S.note = r.result; S.noteSrc = r.src; S.noteFor = i.int;
  renderField();
}

function renderField() {
  const c = camp();
  const tip = "Interviews sync from the tablets with GPS and timings. Each interview is checked, and each interviewer is compared with the rest of the team, so problems surface during fieldwork instead of after it.";
  if (!S.qc) {
    const body = c.status === "Reported" ? emptyState("check", "Fieldwork closed", `${(c.achieved || 0).toLocaleString()} interviews · ${fmtRange(c.fieldStart, c.fieldEnd)}. QC records are archived with the final report.`, `<button class="btn" data-act="openreport" data-cid="${h(c.id)}">Open campaign dashboard</button>`)
      : reached(c, "In field") ? emptyState("clock", "Waiting for interviews", `Fieldwork ${fmtRange(c.fieldStart, c.fieldEnd)}. Checks start once ${MIN_QC} interviews have synced.`, syncChip())
      : emptyState("clock", `Fieldwork starts ${fmtDate(c.fieldStart)}`, "Field QC opens when the questionnaire is approved and the first interviews sync.", S.qn ? `<button class="btn" data-act="view" data-view="pretest">Open Pretest Lab</button>` : "");
    document.getElementById("v-field").innerHTML = `${ctxBar()}${pageHead("Field QC", tip)}<section class="card">${body}</section>`;
    const chip = document.querySelector("#v-field .empty #sync-chip");
    if (chip && chip.tagName === "SPAN" && !pool(c.id)) chip.remove();
    return;
  }
  const qc = S.qc, ex = exclusions();
  const excluded = S.field.filter(r => ex.ints.includes(r.int) || ex.cases.includes(r.id)).length;
  const sel = qc.ints.find(x => x.int === S.selInt) || qc.ints[0];
  const flaggedInts = qc.ints.filter(i => i.risk !== "ok");
  const fmtSpread = m => m >= 1000 ? (m / 1000).toFixed(1) + " km" : Math.round(m) + " m";
  document.getElementById("v-field").innerHTML = `
  ${ctxBar()}
  ${pageHead("Field QC", tip, syncChip())}
  <div class="tiles">
    ${tile("Interviews synced", `${S.field.length.toLocaleString()}`, `of ${c.n.toLocaleString()} · ${fmtRange(c.fieldStart, c.fieldEnd)}`)}
    ${tile("Interviewers flagged", `${flaggedInts.length} of ${qc.ints.length}`, flaggedInts.map(i => i.int).join(", ") || "none", flaggedInts.length > 0)}
    ${tile("Median length", qc.medAll.toFixed(1) + " min", `speeder cut ${qc.speedCut.toFixed(1)} min`, false, "Interviews shorter than half the median are flagged as speeders.")}
    ${tile("Excluded", excluded, `${S.field.length - excluded} pass QC`)}
  </div>
  <div class="grid-2r">
    <div class="stack">
      <section class="card">${cardHead("Interviewers", "", "Select a row to inspect. Checks: speeders, straight-lined grids, GPS spread, short repeated open-ends and time between interviews.")}
        <div class="tbl-wrap"><table class="tight"><thead><tr><th>Interviewer</th><th>City</th><th class="n">Median</th><th class="n">Speeders</th><th class="n">Flat grids</th><th class="n">GPS spread</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>${qc.ints.map(i => `<tr class="clickable${i.risk === "critical" ? " flag-row" : ""}${i.int === sel.int ? " sel" : ""}" data-act="selint" data-int="${i.int}">
          <td class="mono small" data-tip="${i.n} interviews"><b>${i.int}</b></td><td>${h(i.city)}</td><td class="n">${i.medLoi.toFixed(1)}</td><td class="n">${pct(i.speed)}</td><td class="n">${pct(i.flat)}</td><td class="n">${fmtSpread(i.spread)}</td>
          <td><span class="sev ${i.risk}">${SEV_LABEL[i.risk]}</span></td>
          <td><select class="act" data-int="${i.int}" aria-label="Action for ${i.int}"><option value="keep"${S.actions[i.int] === "keep" ? " selected" : ""}>Keep</option><option value="quarantine"${S.actions[i.int] === "quarantine" ? " selected" : ""}>Quarantine</option></select></td></tr>`).join("")}</tbody></table></div>
        <label class="check-row"><input type="checkbox" id="excl"${S.excludeCases ? " checked" : ""}> Exclude ${Object.keys(qc.caseFlags).length} flagged interviews from other interviewers ${info("Individual speeders and straight-liners from interviewers who are otherwise fine.")}</label>
      </section>
      <section class="card">${cardHead("Length by interviewer", "", "Each dot is one interview. Black tick: interviewer median. Red line: speeder cut.")}${stripChart()}</section>
    </div>
    <div class="stack">
      <section class="card">${cardHead(`${sel.int} · ${sel.city}`, `<span class="sev ${sel.risk}">${SEV_LABEL[sel.risk]}</span>`)}
        ${sel.flags.length ? `<div class="list" style="margin-bottom:12px">${sel.flags.map(f => `<div class="list-row"><span class="sev ${f.sev}">${f.sev === "critical" ? "Critical" : "Review"}</span><span class="grow">${h(f.label)}</span></div>`).join("")}</div>` : '<p class="small muted" style="margin-bottom:12px">All checks in normal range.</p>'}
        ${gpsChart(sel)}
      </section>
      <section class="card">${cardHead("Supervisor note", `<button class="btn sm${sel.risk !== "ok" ? " primary" : ""}" data-act="note"${S.busy.note ? " disabled" : ""}>${icon("sparkles")}Draft</button>`)}
        ${S.note && S.noteFor === sel.int ? `<div class="ai-note" id="note-text">${h(S.note)}</div>` : `<div class="empty small" id="note-text">Draft a note for ${sel.int}.</div>`}
        ${statusHTML("note")}
      </section>
    </div>
  </div>`;
}

function stripChart() {
  const qc = S.qc;
  const max = Math.max(16, Math.ceil(Math.max(...S.field.map(r => r.loi)) / 4) * 4);
  const W = 640, padL = 64, padR = 16, top = 24, rowH = 22, H = top + qc.ints.length * rowH + 24;
  const x = v => padL + (W - padL - padR) * Math.min(v, max) / max;
  const step = max > 24 ? 4 : 2;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Interview length by interviewer">`;
  for (let t = 0; t <= max; t += step) s += `<line class="gridline" x1="${x(t)}" x2="${x(t)}" y1="${top - 6}" y2="${H - 22}"/><text x="${x(t)}" y="${H - 8}" text-anchor="middle">${t}</text>`;
  s += `<line x1="${x(qc.speedCut)}" x2="${x(qc.speedCut)}" y1="${top - 14}" y2="${H - 22}" stroke="var(--crit)" stroke-width="1.5"/><text x="${x(qc.speedCut) + 4}" y="${top - 12}">${qc.speedCut.toFixed(1)} min</text>`;
  qc.ints.forEach((i, k) => {
    const y = top + k * rowH + rowH / 2;
    s += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" style="font-family:var(--f-mono);${i.risk === "critical" ? "font-weight:700;fill:var(--crit)" : ""}">${i.int}</text>`;
    S.field.filter(r => r.int === i.int).forEach((r, j) => {
      const jitter = ((j * 37) % 11 - 5) * 0.9;
      s += `<circle cx="${x(r.loi).toFixed(1)}" cy="${(y + jitter).toFixed(1)}" r="3.2" fill="${i.risk === "critical" ? "var(--crit)" : "var(--s1)"}" fill-opacity="0.5" data-tip="${i.int} · #${r.id} · ${r.loi.toFixed(1)} min"/>`;
    });
    s += `<line x1="${x(i.medLoi)}" x2="${x(i.medLoi)}" y1="${y - 8}" y2="${y + 8}" stroke="var(--ink)" stroke-width="2"/>`;
  });
  return s + "</svg>";
}

function gpsChart(sel) {
  const peers = S.field.filter(r => r.city === sel.city);
  const c = peers.reduce((a, r) => [a[0] + r.lat / peers.length, a[1] + r.lng / peers.length], [0, 0]);
  const km = r => [(r.lng - c[1]) * 111.32 * Math.cos(c[0] * Math.PI / 180), (r.lat - c[0]) * 110.57];
  const pts = peers.map(r => ({ r, p: km(r) }));
  const ext = Math.ceil(Math.max(...pts.map(o => Math.max(Math.abs(o.p[0]), Math.abs(o.p[1])))) * 1.1);
  const W = 320, pad = 26, inner = W - 2 * pad;
  const sx = v => pad + inner * (v + ext) / (2 * ext), sy = v => pad + inner * (ext - v) / (2 * ext);
  const col = sel.risk === "critical" ? "var(--crit)" : "var(--s1)";
  let s = `<svg class="chart" viewBox="0 0 ${W} ${W}" role="img" aria-label="Interview locations in ${h(sel.city)}">`;
  for (let t = -ext; t <= ext; t += ext) { s += `<line class="gridline" x1="${sx(t)}" x2="${sx(t)}" y1="${pad}" y2="${W - pad}"/><line class="gridline" y1="${sy(t)}" y2="${sy(t)}" x1="${pad}" x2="${W - pad}"/><text x="${sx(t)}" y="${W - 8}" text-anchor="middle">${t} km</text>`; }
  pts.filter(o => o.r.int !== sel.int).forEach(o => s += `<circle cx="${sx(o.p[0]).toFixed(1)}" cy="${sy(o.p[1]).toFixed(1)}" r="3" fill="var(--muted)" fill-opacity="0.35" data-tip="${o.r.int} · #${o.r.id}"/>`);

function questionnaireMD() {

  let md = `# ${STUDY.client}: ${c.name} (${c.id})\n\nVersion ${qn.version} · ${sum.total} questions · ${sum.reusePct}% reused from the question bank\n`;

  qn.blocks.forEach(b => {
    const qs = qn.questions.filter(q => q.block === b.id);
    if (!qs.length) return;
    md += `\n## ${b.id}. ${b.name} (${b.scope === "all" ? "all respondents" : (PLATFORMS[PLATFORM_KEYS.indexOf(b.scope)] || b.scope) + " users"})\n`;

  if (v === "pretest-fixed") { // walkthrough state: the recorded draft after every recorded fix
    for (let pass = 0; pass < 3; pass++) S.issues.filter(i => S.fixes[i.fixKey]).forEach(i => { if (S.issues.some(x => x.key === i.key)) { S.qn = applyFix(S.qn, S.fixes[i.fixKey], i.title, i.qids); recalcPretest(); } });

function focusEditor() { const t = document.getElementById("qe-text"); if (t) { t.focus(); t.closest("form").scrollIntoView({ block: "center", behavior: "smooth" }); } }

// Survey Builder editing. The AI agent only suggests a draft: the researcher can edit, add, reorder or delete
// any question, or add one from the Question Bank. Every change is saved as a new version with undo.

const QTYPES = [["SA", "Single answer"], ["MA", "Multiple answers"], ["SCALE", "Rating scale"], ["GRID", "Grid"], ["NUM", "Number"], ["OE", "Open-ended"]];
const needsOpts = t => ["SA", "MA", "SCALE", "GRID"].includes(t);
const canEdit = () => !!S.qn && !reached(camp(), "In field");

function nextQid(qn, block) {
  const nums = qn.questions.filter(q => q.block === block).map(q => parseInt(String(q.id).slice(block.length), 10)).filter(Number.isFinite);
  let n = Math.max(0, ...nums) + 1;
  while (qn.questions.some(q => q.id === block + n)) n++;
  return block + n;
}
// Index just after the block's last question, or where the block would start.
function insertAt(qn, block) {
  let idx = -1;
  qn.questions.forEach((q, i) => { if (q.block === block) idx = i; });
  if (idx >= 0) return idx + 1;
  const order = qn.blocks.map(b => b.id), bi = order.indexOf(block);
  const later = qn.questions.findIndex(q => order.indexOf(q.block) > bi);
  return later < 0 ? qn.questions.length : later;
}
function nextBlockLetter(qn) { return "ABCEFGHIJKLMNOPQRTUVWXY".split("").find(l => !qn.blocks.some(b => b.id === l)) || "X"; }
// Main topic block for new questions: the last block before demographics and closing.
function defaultBlock(qn) { const main = qn.blocks.filter(b => !["S", "D", "Z"].includes(b.id)); return (main[main.length - 1] || qn.blocks[0]).id; }
function dependents(qn, id) {
  const out = qn.questions.filter(q => q.id !== id && (q.pipe === id || [q.ask, q.term].some(c => condLeaves(c).some(l => l.q === id)))).map(q => q.id);
  if ([qn.settings.platformSource, qn.settings.mainSource].includes(id)) out.push("platform routing");
  return out;
}
const simpleSelf = (q, c) => !!c && !c.all && !c.any && !c.not && !c.countOf && c.q === q.id && (c.in || c.has);
const simpleAsk = c => !!c && !c.all && !c.any && !c.not && !c.countOf && (c.in || c.has);

function commitQn(next, label, touched, note) {
  S.qnUndo = (S.qnUndo || []).concat([S.qn]).slice(-20);
  next.version = (S.qn.version || 1) + 1;
  next.changelog = S.qn.changelog.concat([{ version: next.version, label, note: note || "", touched, removed: [], qids: touched, by: "Researcher" }]);
  S.qn = next; S.edit = null; S.editErrors = {}; S.armDel = null;
  const c = camp();
  if (c.status === "Draft") setCampaignStatus(c, "Building");
  recalcPretest(); rerender();
}
function undoQn() {
  if (!S.qnUndo || !S.qnUndo.length) return;
  const prev = S.qnUndo[S.qnUndo.length - 1];
  S.qnUndo = S.qnUndo.slice(0, -1);
  toast(`Undid v${S.qn.version}: ${S.qn.changelog[S.qn.changelog.length - 1].label}.`);
  S.qn = prev; S.edit = null;
  recalcPretest(); rerender();
}

function startBlank() {
  const c = camp();
  S.qnUndo = S.qn ? [S.qn] : [];
  S.qn = hydrate({ version: 1, settings: { platformSource: "none", mainSource: "none", scopeCodes: {} },
    blocks: [{ id: "S", name: "Screener", scope: "all" }, { id: "A", name: "Main questions", scope: "all" }, { id: "D", name: "Demographics", scope: "all" }, { id: "Z", name: "Closing", scope: "all" }],
    questions: [{ id: "S1", block: "S", bankId: "SCR-01", term: { q: "S1", in: [1, 5] } }, { id: "S2", block: "S", bankId: "SCR-03", term: { q: "S2", in: [5] } }, { id: "Z1", block: "Z", bankId: "CLS-01" }],
    changelog: [{ version: 1, label: "Started from the standard screener", note: "Age and city screener plus the recontact question. Add the rest by hand or from the Question Bank.", touched: [], removed: [], qids: [], by: "Researcher" }] });
  Object.assign(S, { qnOrigin: "manual", aiLint: [], personas: [], fixes: {}, dismissed: new Set(), edit: { id: "__new", block: "A" }, editErrors: {} });
  if (c.status === "Draft") setCampaignStatus(c, "Building");
  recalcPretest(); rerender();
}

function moveQ(id, dir) {
  const next = clone(S.qn), i = next.questions.findIndex(q => q.id === id), q = next.questions[i];
  let j = i + dir;
  while (j >= 0 && j < next.questions.length && next.questions[j].block !== q.block) j += dir;
  if (j < 0 || j >= next.questions.length) return;
  [next.questions[i], next.questions[j]] = [next.questions[j], next.questions[i]];
  commitQn(next, `Moved ${id} ${dir < 0 ? "up" : "down"}`, [id]);
}
function deleteQ(id) {
  const deps = dependents(S.qn, id);
  if (deps.length) { S.armDel = null; renderBuild(); toast(`${id} is used in the routing of ${deps.join(", ")}. Change that routing first.`); return; }
  if (S.armDel !== id) { S.armDel = id; renderBuild(); return; }
  const next = clone(S.qn);
  next.questions = next.questions.filter(q => q.id !== id);

function addBankQ(itemId, block) {
  const item = kbById(itemId);

  const next = clone(S.qn);
  block = next.blocks.some(b => b.id === block) ? block : defaultBlock(next);
  const q = { id: nextQid(next, block), block, bankId: item.id, text: item.text, type: item.type, options: item.options || [], sec: item.sec || 15, topic: item.topic || "other", source: "reuse", adapted: false, ask: null, term: null };
  next.questions.splice(insertAt(next, block), 0, q);
  commitQn(next, `Added ${q.id} from ${item.id}`, [q.id], `Reused from the Question Bank: ${item.text}`);
  return q.id;

function saveQuestion(form) {
  const id = form.dataset.id, isNew = id === "__new", qn = S.qn;
  const fd = new FormData(form), v = Object.fromEntries(fd.entries());
  const orig = isNew ? null : qn.questions.find(q => q.id === id);
  const piped = orig && orig.pipe && orig.type !== "GRID";
  const type = orig && orig.pipe ? orig.type : v["qe-type"];
  const text = String(v["qe-text"] || "").trim();
  const opts = piped ? [] : String(v["qe-opts"] || "").split("\n").map(x => x.trim()).filter(Boolean);
  const e = {};
  if (!text) e["qe-text"] = "Write the question.";
  if (!piped && needsOpts(type) && opts.length < 2) e["qe-opts"] = "Give at least two options, one per line.";
  if (v["qe-block"] === "__new" && !String(v["qe-newblock"] || "").trim()) e["qe-newblock"] = "Name the new section.";
  let ask;
  if (!v["qe-askq"]) ask = null;
  else if (v["qe-askq"] !== "__keep") {
    const codes = fd.getAll("askopt").map(Number);
    if (!codes.length) e["qe-askq"] = "Tick at least one answer.";
    const src = qn.questions.find(q => q.id === v["qe-askq"]);
    ask = { q: v["qe-askq"], [src && src.type === "MA" ? "has" : "in"]: codes };
  }
  const termCodes = fd.getAll("termopt").map(Number).filter(n => n <= opts.length);
  if (Object.keys(e).length) {
    S.editErrors = e;
    S.edit = Object.assign({}, S.edit, { draft: { type, text, options: opts, sec: Number(v["qe-sec"]) || 15, block: v["qe-block"] === "__new" ? (orig ? orig.block : S.edit.block) : v["qe-block"], ask: ask === undefined ? (orig && orig.ask) : ask, termCodes } });
    renderBuild();
    const first = document.getElementById(Object.keys(e)[0]); if (first) first.focus();
    return;
  }
  const next = clone(qn);
  let block = v["qe-block"];
  if (block === "__new") {
    block = nextBlockLetter(next);
    const before = next.blocks.findIndex(b => b.id === "D" || b.id === "Z");
    next.blocks.splice(before < 0 ? next.blocks.length : before, 0, { id: block, name: String(v["qe-newblock"]).trim(), scope: "all" });
  }
  const sec = clampNum(v["qe-sec"], 4, 120, 15);
  const term = q => termCodes.length ? { q: q.id, [type === "MA" ? "has" : "in"]: termCodes } : (q.term && !simpleSelf(q, q.term) ? q.term : null);
  if (isNew) {
    const q = { id: nextQid(next, block), block, text, type, options: needsOpts(type) ? opts : [], sec, topic: text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) || "other", source: "new", why: "Added by the researcher.", ask: ask || null, term: null };
    q.term = term(q);
    next.questions.splice(insertAt(next, block), 0, q);
    commitQn(next, `Added ${q.id}`, [q.id], text);
    return;
  }
  const i = next.questions.findIndex(q => q.id === id), q = next.questions[i];
  const changed = [];
  if (q.text !== text) changed.push("wording");
  if (!piped && JSON.stringify(q.options || []) !== JSON.stringify(needsOpts(type) ? opts : [])) changed.push("options");
  if (q.type !== type) changed.push("type");
  if ((q.sec || 15) !== sec) changed.push("timing");
  const newAsk = ask === undefined ? q.ask : ask, newTerm = term(q);
  if (JSON.stringify(q.ask || null) !== JSON.stringify(newAsk || null) || JSON.stringify(q.term || null) !== JSON.stringify(newTerm || null)) changed.push("routing");
  if (q.block !== block) changed.push("section");
  if (!changed.length) { S.edit = null; renderBuild(); return; }
  Object.assign(q, { text, type, sec, ask: newAsk || null, term: newTerm, edited: true });
  if (!piped) q.options = needsOpts(type) ? opts : [];
  if (q.bankId) { const b = kbById(q.bankId); q.adapted = !!b && (q.text !== b.text || (!piped && JSON.stringify(q.options) !== JSON.stringify(b.options))); }
  if (q.block !== block) { next.questions.splice(i, 1); q.block = block; next.questions.splice(insertAt(next, block), 0, q); }
  if (changed.includes("wording") || changed.includes("options")) S.aiLint = S.aiLint.filter(l => l.q !== id);
  commitQn(next, `Edited ${id}`, [id], `Changed ${changed.join(", ")}.`);
}

const BASE_KB = KB.length;
const BANK_FROM = {};
const FIELD_QN = {};

// The questionnaire as it went to field: the version approved in this session, else the recorded draft with its
// recorded fixes, else a bank template.
function fieldQn(cid) {
  if (FIELD_QN[cid]) return FIELD_QN[cid];
  const c = camp(cid);
  if (!c || !reached(c, "In field")) return null;
  const d = seedOf(cid), ws = cid === S.cid ? S : S.ws[cid];
  return FIELD_QN[cid] = d.field ? fixedQn(d) : ws && ws.qn ? clone(ws.qn) : d.questionnaire ? fixedQn(d) : hydrate(templateDraft(c, clientOf(c).brand));
}

const MODULE_RULES = [[/screen/, "Screener"], [/demog/, "Demographics"], [/clos|recontact/, "Closing"], [/nps|satisf|recommend|service|visit|wait/, "Satisfaction"],
  [/brand|aware|image|love|\bads?\b|advert/, "Brand health"], [/price|voucher|promo|spend|cheap/, "Price & promotion"], [/livestream|creator|kol|tiktok|social/, "Social commerce"],
  [/media|discover|video|content/, "Media & discovery"], [/platform|shop|lazada|delivery|payment|return|order|mall/, "E-commerce"]];
function moduleFor(qn, q) {
  const key = `${blockOf(qn, q).name} ${q.topic || ""} ${q.text}`.toLowerCase();
  return (MODULE_RULES.find(([re]) => re.test(key)) || [null, "Category"])[1];
}
const normText = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

// Adds a campaign's new questions to the bank, once, when its questionnaire is approved for fieldwork.
function bankFromCampaign(cid, qn, on, fresh) {
  if (BANK_FROM[cid] || !qn) return 0;
  BANK_FROM[cid] = [];
  qn.questions.forEach(q => {
    if (q.bankId || !q.text) return;
    if (KB.some(k => normText(k.text) === normText(q.text))) return;
    const id = `QB-${String(101 + KB.length - BASE_KB)}`;
    KB.push({ id, module: moduleFor(qn, q), type: q.type, text: q.text, options: q.pipe && q.type !== "GRID" ? [] : (q.options || []).slice(), sec: q.sec || 15,
      uses: 1, nonresp: null, last: cid, topic: q.topic || "other", from: cid, fromQ: q.id, addedOn: on, fresh: !!fresh });
    BANK_FROM[cid].push(id);

}
let bankReady = false;
function ensureBank() {
  if (bankReady) return;
  bankReady = true;
  S.campaigns.filter(c => reached(c, "In field")).sort((a, b) => a.fieldStart.localeCompare(b.fieldStart))
    .forEach(c => bankFromCampaign(c.id, fieldQn(c.id), addDays(c.fieldStart, -4), false));
}
function resetKnowledge() {
  KB.length = BASE_KB;
  Object.keys(BANK_FROM).forEach(k => delete BANK_FROM[k]);
  Object.keys(FIELD_QN).forEach(k => delete FIELD_QN[k]);
  bankReady = false;
  S.facts = FACT_DOCS.map(d => clone(d));
  S.factSaved = {}; S.factOpen = null; S.ask = null;
}
// Called when a questionnaire is approved for fieldwork.
function onApproved(c, qn) {
  ensureBank();
  FIELD_QN[c.id] = clone(qn);
  return bankFromCampaign(c.id, FIELD_QN[c.id], TODAY, true);
}

// Campaigns that fielded each bank question, and drafts that use it now.
function bankUsage() {
  ensureBank();
  const used = {}, draft = {}, add = (m, k, cid) => { m[k] = m[k] || []; if (!m[k].includes(cid)) m[k].push(cid); };
  S.campaigns.forEach(c => {
    if (reached(c, "In field")) {
      const qn = fieldQn(c.id);
      if (qn) qn.questions.forEach(q => { const born = q.bankId ? null : KB.find(k => k.from === c.id && k.fromQ === q.id); if (q.bankId || born) add(used, q.bankId || born.id, c.id); });
    } else {
      const ws = c.id === S.cid ? S : S.ws[c.id];
      if (ws && ws.qn) ws.qn.questions.forEach(q => { if (q.bankId) add(draft, q.bankId, c.id); });
